<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-label="B树与B+树结构对比及散列表冲突处理与ASL规则">
  <rect width="860" height="360" rx="8" fill="#F4F6F3" stroke="#D8E0DA" stroke-width="1.5"/>
  <text x="28" y="34" fill="#17343B" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700">图 6-2 · 多路平衡查找树（B 树 vs B+ 树）与散列表（Hash Table）冲突处理</text>
  <line x1="28" y1="46" x2="832" y2="46" stroke="#CBD7CF" stroke-width="1.5"/>

  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13">
    <!-- Left Panel: B-Tree vs B+ Tree -->
    <rect x="28" y="64" width="400" height="272" rx="6" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="228" y="90" fill="#287B73" font-weight="700" text-anchor="middle">1. m 阶 B 树与 B+ 树的核心结构差异</text>

    <rect x="46" y="106" width="364" height="72" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.2"/>
    <text x="60" y="128" fill="#17343B" font-weight="700">m 阶 B 树节点关键字个数 K 的上下界（必背公式）：</text>
    <text x="60" y="150" fill="#287B73" font-weight="700">• 根节点：1 ≤ K ≤ m - 1（子树数 2 ～ m）</text>
    <text x="60" y="170" fill="#C47743" font-weight="700">• 非根节点：⌈m/2⌉ - 1 ≤ K ≤ m - 1（上溢分裂 ⌈m/2⌉）</text>

    <rect x="46" y="190" width="364" height="128" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <text x="60" y="212" fill="#287B73" font-weight="700">为何数据库索引（MySQL InnoDB）首选 B+ 树：</text>
    <text x="60" y="236" fill="#17343B">① <tspan font-weight="700">非叶节点纯索引</tspan>：内部节点不存数据记录，单磁盘页</text>
    <text x="60" y="256" fill="#17343B">   容纳更多索引键（扇出大），<tspan font-weight="700" fill="#287B73">树高更低，磁盘 I/O 更少</tspan></text>
    <text x="60" y="280" fill="#17343B">② <tspan font-weight="700">叶子双向链表</tspan>：所有关键字全在叶节点且链表串联，</text>
    <text x="60" y="300" fill="#17343B">   极适合 <tspan font-weight="700" fill="#C47743">BETWEEN 范围查询</tspan>（B 树需跨层中序回溯）</text>

    <!-- Right Panel: Hash Table -->
    <rect x="448" y="64" width="384" height="272" rx="6" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.5"/>
    <text x="640" y="90" fill="#17343B" font-weight="700" text-anchor="middle">2. 散列表（Hash Table）冲突处理与 ASL 计数铁律</text>

    <rect x="458" y="106" width="364" height="104" rx="4" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.2"/>
    <text x="470" y="128" fill="#17343B" font-weight="700">冲突解决（H(key) = key % p，p 取 ≤m 最大质数）：</text>
    <text x="470" y="150" fill="#287B73" font-weight="700">• 拉链法（链地址法）：同义词挂同一单链表，无聚集现象</text>
    <text x="470" y="172" fill="#C47743" font-weight="700">• 开放定址法：H_i = (H(key) + d_i) % m</text>
    <text x="470" y="194" fill="#61747A">  线性探测易产生一次聚集；删除元素仅可做逻辑删除标记</text>

    <rect x="458" y="220" width="364" height="98" rx="4" fill="#F4E6D9" stroke="#C47743" stroke-width="1.2"/>
    <text x="470" y="242" fill="#C47743" font-weight="700">平均查找长度（ASL）手算必考三大铁律：</text>
    <text x="470" y="264" fill="#17343B">① 装填因子 <tspan font-weight="700">α = 记录数 n / 表长 m</tspan>（ASL 直接取决于 α）</text>
    <text x="470" y="286" fill="#17343B">② <tspan font-weight="700">ASL_成功</tspan> 分母为 <tspan font-weight="700" fill="#287B73">n</tspan>；<tspan font-weight="700">ASL_失败</tspan> 分母为 <tspan font-weight="700" fill="#C47743">p</tspan> (非表长 m)</text>
    <text x="470" y="306" fill="#61747A">③ 开放定址失败时，最后与“空单元”的那次比较必须计入</text>
  </g>
</svg>