<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-label="单链表头插法与双链表节点插入删除指针修改顺序">
  <rect width="860" height="360" rx="8" fill="#F4F6F3" stroke="#D8E0DA" stroke-width="1.5"/>
  <text x="28" y="34" fill="#17343B" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700">图 1-1 · 链式存储核心操作：单链表头插法（原地逆置）与双链表插入指针修改顺序</text>
  <line x1="28" y1="46" x2="832" y2="46" stroke="#CBD7CF" stroke-width="1.5"/>

  <defs>
    <marker id="aT" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#287B73"/>
    </marker>
    <marker id="aO" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#C47743"/>
    </marker>
  </defs>

  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13">
    <!-- Left Panel: Singly Linked List Head Insert -->
    <rect x="28" y="64" width="390" height="272" rx="6" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="223" y="90" fill="#287B73" font-weight="700" text-anchor="middle">1. 单链表头插法（逆序建表 / 原地逆置）</text>

    <!-- Nodes: L (head) at x=54, y=132; a1 (old first) at x=270, y=132; s (new node) at x=162, y=200 -->
    <rect x="54" y="122" width="84" height="34" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
    <line x1="106" y1="122" x2="106" y2="156" stroke="#287B73" stroke-width="1.2"/>
    <text x="80" y="144" fill="#17343B" font-weight="700" text-anchor="middle">头 L</text>
    <text x="122" y="144" fill="#287B73" text-anchor="middle">next</text>

    <rect x="274" y="122" width="96" height="34" rx="4" fill="#FAFBF8" stroke="#17343B" stroke-width="1.5"/>
    <line x1="334" y1="122" x2="334" y2="156" stroke="#17343B" stroke-width="1.2"/>
    <text x="304" y="144" fill="#17343B" font-weight="700" text-anchor="middle">原首元 a1</text>
    <text x="352" y="144" fill="#61747A" text-anchor="middle">^</text>

    <!-- Old link L->a1 (dashed) -->
    <line x1="138" y1="139" x2="268" y2="139" stroke="#AEBDB7" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="204" y="131" fill="#61747A" text-anchor="middle">原 L-&gt;next</text>

    <!-- New Node s -->
    <rect x="158" y="192" width="96" height="34" rx="4" fill="#F4E6D9" stroke="#C47743" stroke-width="1.8"/>
    <line x1="218" y1="192" x2="218" y2="226" stroke="#C47743" stroke-width="1.2"/>
    <text x="188" y="214" fill="#C47743" font-weight="700" text-anchor="middle">新节点 s</text>
    <text x="236" y="214" fill="#C47743" text-anchor="middle">next</text>

    <!-- Step 1: s->next = L->next -->
    <path d="M254,209 Q296,209 296,162" fill="none" stroke="#287B73" stroke-width="2" marker-end="url(#aT)"/>
    <text x="334" y="196" fill="#287B73" font-weight="700" text-anchor="middle">① 先连后继</text>

    <!-- Step 2: L->next = s -->
    <path d="M122,156 Q122,209 152,209" fill="none" stroke="#C47743" stroke-width="2" marker-end="url(#aO)"/>
    <text x="92" y="196" fill="#C47743" font-weight="700" text-anchor="middle">② 再改头指针</text>

    <rect x="46" y="242" width="354" height="78" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.2"/>
    <text x="60" y="264" fill="#17343B" font-weight="700">核心铁律：先用 s-&gt;next 接住后继，防止断链丢失</text>
    <text x="60" y="286" fill="#287B73" font-weight="700">① s-&gt;next = L-&gt;next;   ② L-&gt;next = s;</text>
    <text x="60" y="308" fill="#61747A">每次在头结点 L 之后插入，输出顺序与输入顺序完全相反</text>

    <!-- Right Panel: Doubly Linked List Insert -->
    <rect x="438" y="64" width="394" height="272" rx="6" fill="#FAFBF8" stroke="#C47743" stroke-width="1.5"/>
    <text x="635" y="90" fill="#C47743" font-weight="700" text-anchor="middle">2. 双链表在节点 p 之后插入新节点 s 的四步指针修改</text>

    <!-- Node p (x=462, y=122) and Node p->next (x=706, y=122) -->
    <rect x="462" y="122" width="96" height="34" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
    <text x="510" y="144" fill="#17343B" font-weight="700" text-anchor="middle">前驱节点 p</text>

    <rect x="706" y="122" width="102" height="34" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
    <text x="757" y="144" fill="#17343B" font-weight="700" text-anchor="middle">后继 p-&gt;next</text>

    <!-- Node s (x=584, y=188) -->
    <rect x="584" y="188" width="96" height="34" rx="4" fill="#F4E6D9" stroke="#C47743" stroke-width="1.8"/>
    <text x="632" y="210" fill="#C47743" font-weight="700" text-anchor="middle">新节点 s</text>

    <!-- 4 arrows -->
    <path d="M680,198 Q736,198 736,162" fill="none" stroke="#287B73" stroke-width="1.8" marker-end="url(#aT)"/>
    <text x="720" y="184" fill="#287B73" font-weight="700">①</text>

    <path d="M764,156 Q764,214 686,214" fill="none" stroke="#287B73" stroke-width="1.8" marker-end="url(#aT)"/>
    <text x="754" y="214" fill="#287B73" font-weight="700">②</text>

    <path d="M584,198 Q528,198 528,162" fill="none" stroke="#C47743" stroke-width="1.8" marker-end="url(#aO)"/>
    <text x="546" y="184" fill="#C47743" font-weight="700">③</text>

    <path d="M500,156 Q500,214 578,214" fill="none" stroke="#C47743" stroke-width="1.8" marker-end="url(#aO)"/>
    <text x="512" y="214" fill="#C47743" font-weight="700">④</text>

    <rect x="456" y="242" width="358" height="78" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.2"/>
    <text x="470" y="264" fill="#287B73" font-weight="700">① s-&gt;next = p-&gt;next;   ② p-&gt;next-&gt;prior = s;</text>
    <text x="470" y="286" fill="#C47743" font-weight="700">③ s-&gt;prior = p;        ④ p-&gt;next = s;</text>
    <text x="470" y="308" fill="#61747A">铁律：④ 修改 p-&gt;next 必须放在 ① 和 ② 之后执行</text>
  </g>
</svg>