<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-label="五段指令流水线时空图与三大冒险解决机制">
  <rect width="860" height="360" rx="8" fill="#F4F6F3" stroke="#D8E0DA" stroke-width="1.5"/>
  <text x="28" y="34" fill="#17343B" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700">图 5-2 · 五段指令流水线（IF / ID / EX / MEM / WB）与三大冒险解决机制</text>
  <line x1="28" y1="46" x2="832" y2="46" stroke="#CBD7CF" stroke-width="1.5"/>

  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13">
    <!-- Left Panel: 5-Stage Pipeline Space-Time Diagram & Formula -->
    <rect x="28" y="64" width="400" height="272" rx="6" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="228" y="90" fill="#287B73" font-weight="700" text-anchor="middle">1. 五段 RISC 流水线阶段职责与总耗时公式</text>

    <!-- 5 stage boxes -->
    <g text-anchor="middle" font-weight="700">
      <rect x="44"  y="106" width="68" height="44" rx="3" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
      <text x="78"  y="125" fill="#287B73">① IF</text><text x="78"  y="143" fill="#17343B">取指</text>
      <rect x="118" y="106" width="68" height="44" rx="3" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
      <text x="152" y="125" fill="#287B73">② ID</text><text x="152" y="143" fill="#17343B">译码读寄</text>
      <rect x="192" y="106" width="68" height="44" rx="3" fill="#F4E6D9" stroke="#C47743" stroke-width="1.4"/>
      <text x="226" y="125" fill="#C47743">③ EX</text><text x="226" y="143" fill="#17343B">ALU运算</text>
      <rect x="266" y="106" width="68" height="44" rx="3" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
      <text x="300" y="125" fill="#287B73">④ MEM</text><text x="300" y="143" fill="#17343B">数据访存</text>
      <rect x="340" y="106" width="70" height="44" rx="3" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
      <text x="375" y="125" fill="#287B73">⑤ WB</text><text x="375" y="143" fill="#17343B">写回寄存</text>
    </g>

    <rect x="44" y="162" width="366" height="158" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.2"/>
    <text x="56" y="184" fill="#17343B" font-weight="700">k 段流水线连续执行 n 条指令（时钟周期为 Δt）必考公式：</text>
    <text x="56" y="208" fill="#C47743" font-weight="700">• 理想流水线总执行时间：T_k = (k + n - 1) × Δt</text>
    <text x="56" y="230" fill="#17343B">  （首条指令走完需 k 周期，其余 n-1 条每周期流出 1 条）</text>
    <text x="56" y="252" fill="#287B73" font-weight="700">• 吞吐率 TP = n / [(k + n - 1) × Δt]（极限 TP = 1/Δt）</text>
    <text x="56" y="274" fill="#287B73" font-weight="700">• 加速比 S = 串行时间 / 流水时间 = (n × k) / (k + n - 1)</text>
    <text x="56" y="298" fill="#61747A">• 若发生 m 次阻塞停顿，总周期数 = <tspan font-weight="700" fill="#17343B">k + n - 1 + m</tspan></text>

    <!-- Right Panel: Three Pipeline Hazards -->
    <rect x="448" y="64" width="384" height="272" rx="6" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.5"/>
    <text x="640" y="90" fill="#17343B" font-weight="700" text-anchor="middle">2. 流水线三大冒险（结构 / 数据 / 控制冒险）与解决方案</text>

    <rect x="462" y="104" width="356" height="54" rx="4" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.2"/>
    <text x="474" y="124" fill="#17343B" font-weight="700">① 结构冒险（资源冲突 · 多条指令同周期争同一部件）：</text>
    <text x="474" y="144" fill="#287B73" font-weight="700">解决：采用哈佛结构分离指令 Cache 与数据 Cache</text>

    <rect x="462" y="166" width="356" height="92" rx="4" fill="#F4E6D9" stroke="#C47743" stroke-width="1.4"/>
    <text x="474" y="186" fill="#C47743" font-weight="700">② 数据冒险（写后读 RAW · 前条未写回，后条就要读）：</text>
    <text x="474" y="206" fill="#17343B">• <tspan font-weight="700" fill="#287B73">运算相邻</tspan>：靠<tspan font-weight="700" fill="#287B73">旁路转发 (Forwarding)</tspan> 将 EX/MEM 结果</text>
    <text x="474" y="224" fill="#17343B">  直接拉回 ALU 输入端，<tspan font-weight="700">0 停顿解决</tspan></text>
    <text x="474" y="246" fill="#C47743" font-weight="700">• Load-Use 冒险（LW 紧跟运算）：配转发仍需停 1 周期</text>

    <rect x="462" y="266" width="356" height="54" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <text x="474" y="286" fill="#287B73" font-weight="700">③ 控制冒险（分支冲突 · 转移改 PC 致预取指令作废）：</text>
    <text x="474" y="306" fill="#17343B">解决：<tspan font-weight="700">动态分支预测 (BTB)</tspan>、ID 级判分支、分支延迟槽</text>
  </g>
</svg>