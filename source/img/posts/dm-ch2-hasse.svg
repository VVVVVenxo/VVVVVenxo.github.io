<svg xmlns="http://www.w3.org/2000/svg" width="860" height="370" viewBox="0 0 860 370" role="img" aria-label="偏序集哈斯图构造与极小元最小元上界上确界判定">
  <rect width="860" height="370" rx="8" fill="#F4F6F3" stroke="#D8E0DA" stroke-width="1.5"/>
  <text x="28" y="34" fill="#17343B" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700">图 2-2 · 偏序集哈斯图（Hasse Diagram）构造与特殊元素判定示例</text>
  <line x1="28" y1="46" x2="832" y2="46" stroke="#CBD7CF" stroke-width="1.5"/>

  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13">
    <!-- Left Panel: Divisibility Poset -->
    <rect x="28" y="62" width="380" height="284" rx="6" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.5"/>
    <text x="218" y="88" fill="#17343B" font-weight="700" text-anchor="middle">1. 整除偏序集 A = {1, 2, 3, 4, 6, 12} 的哈斯图</text>

    <!-- Edges (upward implies direction, omit self-loops and transitive edges) -->
    <!-- 1(218,292) -> 2(168,236), 3(268,236)
         2(168,236) -> 4(148,176), 6(218,176)
         3(268,236) -> 6(218,176)
         4(148,176) -> 12(218,118)
         6(218,176) -> 12(218,118) -->
    <g stroke="#287B73" stroke-width="2">
      <line x1="218" y1="292" x2="168" y2="236"/>
      <line x1="218" y1="292" x2="268" y2="236"/>
      <line x1="168" y1="236" x2="148" y2="176"/>
      <line x1="168" y1="236" x2="218" y2="176"/>
      <line x1="268" y1="236" x2="218" y2="176"/>
      <line x1="148" y1="176" x2="218" y2="118"/>
      <line x1="218" y1="176" x2="218" y2="118"/>
    </g>

    <!-- Nodes -->
    <g text-anchor="middle" font-weight="700">
      <circle cx="218" cy="118" r="16" fill="#F4E6D9" stroke="#C47743" stroke-width="2"/><text x="218" y="123" fill="#C47743">12</text>
      <circle cx="148" cy="176" r="16" fill="#FAFBF8" stroke="#287B73" stroke-width="1.8"/><text x="148" y="181" fill="#17343B">4</text>
      <circle cx="218" cy="176" r="16" fill="#FAFBF8" stroke="#287B73" stroke-width="1.8"/><text x="218" y="181" fill="#17343B">6</text>
      <circle cx="168" cy="236" r="16" fill="#D8E6E0" stroke="#287B73" stroke-width="1.8"/><text x="168" y="241" fill="#17343B">2</text>
      <circle cx="268" cy="236" r="16" fill="#D8E6E0" stroke="#287B73" stroke-width="1.8"/><text x="268" y="241" fill="#17343B">3</text>
      <circle cx="218" cy="292" r="16" fill="#F4E6D9" stroke="#C47743" stroke-width="2"/><text x="218" y="297" fill="#C47743">1</text>
    </g>

    <text x="256" y="123" fill="#C47743" font-weight="700">← 最大元 &amp; 唯一极大元</text>
    <text x="256" y="297" fill="#C47743" font-weight="700">← 最小元 &amp; 唯一极小元</text>
    <text x="218" y="330" fill="#61747A" text-anchor="middle">画法：省去自环、省去传递边、方向默认自下而上</text>

    <!-- Right Panel: Special Elements Comparison -->
    <rect x="428" y="62" width="404" height="284" rx="6" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="630" y="88" fill="#17343B" font-weight="700" text-anchor="middle">2. 极小/最小元、极大/最大元与上下界判定规则</text>

    <rect x="444" y="106" width="372" height="54" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <text x="458" y="128" fill="#287B73" font-weight="700">极小元 vs 极大元（一定存在，可能不止一个）</text>
    <text x="458" y="148" fill="#17343B">下方无连线的顶点为极小元；上方无连线的顶点为极大元</text>

    <rect x="444" y="172" width="372" height="54" rx="4" fill="#F4E6D9" stroke="#C47743" stroke-width="1.2"/>
    <text x="458" y="194" fill="#C47743" font-weight="700">最小元 vs 最大元（不一定存在，若存在必唯一）</text>
    <text x="458" y="214" fill="#17343B">仅当极小元唯一时才是最小元；极大元唯一时才是最大元</text>

    <rect x="444" y="238" width="372" height="86" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.2"/>
    <text x="462" y="260" fill="#17343B" font-weight="700">子集 B = {2, 3} 在左图中的上下界示例：</text>
    <text x="462" y="282" fill="#17343B">• 上界：能同时排在 2 和 3 上方的元素 → {6, 12}</text>
    <text x="462" y="302" fill="#287B73" font-weight="700">• 最小上界（上确界 sup B）：所有上界中的最小元 → 6</text>
    <text x="462" y="320" fill="#17343B">• 下界与最大下界（下确界 inf B）：均为 1</text>
  </g>
</svg>