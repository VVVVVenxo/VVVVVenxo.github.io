<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-label="信号量PV操作生产者消费者模型与死锁四大必要条件">
  <rect width="860" height="360" rx="8" fill="#F4F6F3" stroke="#D8E0DA" stroke-width="1.5"/>
  <text x="28" y="34" fill="#17343B" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700">图 2-2 · 信号量 PV 同步互斥铁律（生产者-消费者）与死锁四大必要条件</text>
  <line x1="28" y1="46" x2="832" y2="46" stroke="#CBD7CF" stroke-width="1.5"/>

  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13">
    <!-- Left Panel: Semaphore Producer-Consumer -->
    <rect x="28" y="64" width="400" height="272" rx="6" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="228" y="90" fill="#287B73" font-weight="700" text-anchor="middle">1. 信号量 PV 操作与生产者-消费者同步模板</text>

    <rect x="46" y="106" width="364" height="68" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.2"/>
    <text x="60" y="128" fill="#17343B" font-weight="700">记录型信号量 S（遵循“让权等待”，阻塞而非忙等）：</text>
    <text x="60" y="150" fill="#287B73" font-weight="700">• P(S) / wait(S)：S.value--；若 &lt; 0 则主动阻塞入队</text>
    <text x="60" y="168" fill="#C47743" font-weight="700">• V(S) / signal(S)：S.value++；若 ≤ 0 则唤醒队首进程</text>

    <rect x="44" y="186" width="368" height="134" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <text x="56" y="208" fill="#17343B" font-weight="700">缓冲池容量 n：设 mutex = 1 ， empty = n ， full = 0</text>
    <text x="56" y="232" fill="#287B73" font-weight="700">生产者: P(empty)→P(mutex)→放入→V(mutex)→V(full)</text>
    <text x="56" y="254" fill="#287B73" font-weight="700">消费者: P(full)→P(mutex)→取出→V(mutex)→V(empty)</text>
    <text x="56" y="280" fill="#C47743" font-weight="700">铁律：同步 P 操作必须在互斥 P(mutex) 之前执行！</text>
    <text x="56" y="302" fill="#61747A">（若先 P(mutex) 后 P(empty)，缓冲满时抱锁必致死锁）</text>

    <!-- Right Panel: Deadlock 4 Conditions & Banker's Algorithm -->
    <rect x="448" y="64" width="384" height="272" rx="6" fill="#FAFBF8" stroke="#C47743" stroke-width="1.5"/>
    <text x="640" y="90" fill="#C47743" font-weight="700" text-anchor="middle">2. 死锁产生的四大必要条件与银行家算法</text>

    <rect x="460" y="106" width="360" height="106" rx="4" fill="#F4E6D9" stroke="#C47743" stroke-width="1.2"/>
    <text x="472" y="128" fill="#C47743" font-weight="700">死锁四大必要条件（缺一不可，破坏任一即可预防）：</text>
    <text x="472" y="150" fill="#17343B">① <tspan font-weight="700">互斥条件</tspan>：资源排他性独占使用（如打印机、互斥锁）</text>
    <text x="472" y="170" fill="#17343B">② <tspan font-weight="700">不剥夺条件</tspan>：已获资源在用完前不能被强行剥夺</text>
    <text x="472" y="190" fill="#17343B">③ <tspan font-weight="700">请求和保持</tspan>：已保持资源，又提出新资源请求被阻塞</text>
    <text x="472" y="206" fill="#17343B">④ <tspan font-weight="700">循环等待</tspan>：存在等待环路（按编号递增申请可破除）</text>

    <rect x="460" y="222" width="360" height="98" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.2"/>
    <text x="472" y="244" fill="#17343B" font-weight="700">银行家算法（死锁避免 · 寻找安全序列）：</text>
    <text x="472" y="266" fill="#287B73" font-weight="700">• 矩阵恒等式：Need[i] = Max[i] - Allocation[i]</text>
    <text x="472" y="286" fill="#17343B">• 检查是否存在序列使每步 <tspan font-weight="700">Need[i] ≤ Work</tspan>，完成后</text>
    <text x="472" y="306" fill="#61747A">  回收 <tspan font-weight="700" fill="#17343B">Work += Allocation[i]</tspan>（不安全状态不等于死锁）</text>
  </g>
</svg>