<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-label="Cache三种地址映射方式物理地址拆分与写回法全写法对比">
  <rect width="860" height="360" rx="8" fill="#F4F6F3" stroke="#D8E0DA" stroke-width="1.5"/>
  <text x="28" y="34" fill="#17343B" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700">图 3-2 · Cache 三种地址映射（物理地址拆分公式）与写策略（全写法 vs 写回法）</text>
  <line x1="28" y1="46" x2="832" y2="46" stroke="#CBD7CF" stroke-width="1.5"/>

  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13">
    <!-- Left Panel: 3 Cache Address Mappings -->
    <rect x="28" y="64" width="416" height="272" rx="6" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="236" y="90" fill="#287B73" font-weight="700" text-anchor="middle">1. Cache 三种映射的主存物理地址拆分（必考计算）</text>

    <!-- Mapping 1: Direct Mapped -->
    <rect x="44" y="104" width="384" height="62" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <text x="56" y="124" fill="#287B73" font-weight="700">① 直接映射（行号 i = 主存块号 j % Cache总行数 2^c）：</text>
    <text x="236" y="150" fill="#17343B" font-weight="700" text-anchor="middle">[ 标记 Tag (t 位)  |  Cache 行号 (c 位)  |  块内地址 (b 位) ]</text>

    <!-- Mapping 2: Fully Associative -->
    <rect x="44" y="174" width="384" height="62" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.2"/>
    <text x="56" y="194" fill="#17343B" font-weight="700">② 全相联映射（可装入任意空行，冲突最低但比较电路最贵）：</text>
    <text x="236" y="220" fill="#17343B" font-weight="700" text-anchor="middle">[        标记 Tag (t = 主存块号全长 m 位)        |  块内地址 (b 位) ]</text>

    <!-- Mapping 3: Set Associative -->
    <rect x="44" y="244" width="384" height="76" rx="4" fill="#F4E6D9" stroke="#C47743" stroke-width="1.4"/>
    <text x="56" y="264" fill="#C47743" font-weight="700">③ k 路组相联映射（每组 k 行，共 Q=2^q 组；组号 = j % Q）：</text>
    <text x="236" y="290" fill="#C47743" font-weight="700" text-anchor="middle">[ 标记 Tag (t 位)  |  Cache 组号 (q 位)  |  块内地址 (b 位) ]</text>
    <text x="236" y="310" fill="#61747A" text-anchor="middle">组间采用直接映射定位组号，组内 k 行采用全相联并行比较 Tag</text>

    <!-- Right Panel: Cache Total Capacity & Write Policies -->
    <rect x="460" y="64" width="372" height="272" rx="6" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.5"/>
    <text x="646" y="90" fill="#17343B" font-weight="700" text-anchor="middle">2. Cache 总容量公式与写一致性策略</text>

    <rect x="474" y="104" width="344" height="92" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.2"/>
    <text x="486" y="126" fill="#17343B" font-weight="700">Cache 单行总位数（控制位 + 标记位 + 数据块）：</text>
    <text x="486" y="148" fill="#287B73" font-weight="700">• 有效位 (1位) + 脏位 (写回法 1位) + 替换算法位 (LRU)</text>
    <text x="486" y="168" fill="#287B73" font-weight="700">  + 标记位 (Tag = t位) + 数据块 (2^b × 8 位)</text>
    <text x="486" y="188" fill="#61747A">（注：k 路组相联每行的 LRU 替换控制位占 log2 k 位）</text>

    <rect x="474" y="206" width="344" height="114" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <text x="486" y="228" fill="#17343B" font-weight="700">两大黄金写策略组合（写命中 + 写不命中搭配）：</text>
    <text x="486" y="250" fill="#287B73" font-weight="700">① 全写法 (Write-Through) + 非写分配法 (非调入)</text>
    <text x="486" y="268" fill="#17343B">   命中时同时写 Cache 与主存（配写缓冲）；不命中直接写主存</text>
    <text x="486" y="290" fill="#C47743" font-weight="700">② 写回法 (Write-Back) + 写分配法 (Write-Allocate)</text>
    <text x="486" y="308" fill="#17343B">   命中时只写 Cache 置脏位=1，换出时才写回；不命中先调入</text>
  </g>
</svg>