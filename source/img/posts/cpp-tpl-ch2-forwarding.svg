<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="'Microsoft YaHei', 'Noto Sans SC', sans-serif">
  <rect width="860" height="360" rx="8" fill="#F4F6F3" stroke="#D5DDD8" stroke-width="1.5"/>
  <text x="430" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#17343B">图 2-1：引用折叠规则（Reference Collapsing）、万能引用推导与 std::forward 完美转发</text>

  <!-- 左栏 -->
  <rect x="28" y="54" width="396" height="284" rx="6" fill="#FFFFFF" stroke="#CBD7CF" stroke-width="1.5"/>
  <text x="226" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#17343B">1. 引用折叠四条规则与万能引用（T&amp;&amp;）类型推导</text>

  <g font-size="13">
    <rect x="44" y="92" width="364" height="108" rx="4" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.2"/>
    <text x="56" y="112" fill="#287B73" font-weight="700">C++11 引用折叠规则（含左值引用即折叠为左值引用）：</text>
    <text x="56" y="134" fill="#17343B">• <tspan font-family="Consolas, monospace" font-weight="700">T&amp;  + &amp;  → T&amp;</tspan>      • <tspan font-family="Consolas, monospace" font-weight="700">T&amp;&amp; + &amp;  → T&amp;</tspan></text>
    <text x="56" y="155" fill="#17343B">• <tspan font-family="Consolas, monospace" font-weight="700">T&amp;  + &amp;&amp; → T&amp;</tspan>      • <tspan font-family="Consolas, monospace" font-weight="700" fill="#C47743">T&amp;&amp; + &amp;&amp; → T&amp;&amp;</tspan>（唯一右值引用）</text>
    <text x="56" y="175" fill="#17343B">• 仅当 <tspan font-family="Consolas, monospace">T</tspan> 发生当前模板推导且形式严格为 <tspan font-family="Consolas, monospace">T&amp;&amp;</tspan> 时，</text>
    <text x="56" y="194" fill="#61747A">  才构成万能引用；<tspan font-family="Consolas, monospace">vector&lt;T&gt;::push_back(T&amp;&amp;)</tspan> 不是</text>

    <rect x="44" y="210" width="364" height="114" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <text x="56" y="230" fill="#287B73" font-weight="700">万能引用 template&lt;class T&gt; void wrapper(T&amp;&amp; arg) 推导：</text>
    <text x="56" y="252" fill="#17343B">• <tspan font-weight="700">传入左值 int x</tspan>：<tspan font-family="Consolas, monospace">T</tspan> 被推导为 <tspan font-weight="700" font-family="Consolas, monospace">int&amp;</tspan>，</text>
    <text x="56" y="272" fill="#17343B">  形参 <tspan font-family="Consolas, monospace">int&amp; &amp;&amp;</tspan> 经引用折叠变为左值引用 <tspan font-weight="700" font-family="Consolas, monospace">int&amp;</tspan></text>
    <text x="56" y="293" fill="#17343B">• <tspan font-weight="700">传入右值 42</tspan>：<tspan font-family="Consolas, monospace">T</tspan> 被推导为非引用类型 <tspan font-weight="700" font-family="Consolas, monospace">int</tspan>，</text>
    <text x="56" y="313" fill="#287B73" font-weight="700">  形参保持为右值引用 int&amp;&amp;（用 T 编码实参值类别）</text>
  </g>

  <!-- 右栏 -->
  <rect x="442" y="54" width="390" height="284" rx="6" fill="#FFFFFF" stroke="#CBD7CF" stroke-width="1.5"/>
  <text x="637" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#17343B">2. 具名右值引用的左值退化与 std::forward 还原</text>

  <g font-size="13">
    <rect x="456" y="92" width="362" height="108" rx="4" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.2"/>
    <text x="468" y="112" fill="#C47743" font-weight="700">具名右值引用本身是左值（Named Rvalue Ref）：</text>
    <text x="468" y="134" fill="#17343B">• 进入 <tspan font-family="Consolas, monospace">wrapper(T&amp;&amp; arg)</tspan> 函数体后，形参 <tspan font-family="Consolas, monospace">arg</tspan> 具有</text>
    <text x="468" y="154" fill="#17343B">  名称且可取地址（<tspan font-family="Consolas, monospace">&amp;arg</tspan> 合法），表达式值类别恒为<tspan font-weight="700">左值</tspan></text>
    <text x="468" y="175" fill="#17343B">• 若直接调用 <tspan font-family="Consolas, monospace">target(arg)</tspan>，无论外部传入左值或右值，</text>
    <text x="468" y="194" fill="#61747A">  内部一律匹配 <tspan font-family="Consolas, monospace">target(const T&amp;)</tspan> 拷贝版本，丢失移动</text>

    <rect x="456" y="210" width="362" height="114" rx="4" fill="#F4E6D9" stroke="#C47743" stroke-width="1.2"/>
    <text x="468" y="230" fill="#C47743" font-weight="700">std::forward&lt;T&gt;(arg) 条件转换还原值类别：</text>
    <text x="468" y="252" fill="#17343B">• 核心实现：<tspan font-weight="700" font-family="Consolas, monospace">return static_cast&lt;T&amp;&amp;&gt;(arg);</tspan></text>
    <text x="468" y="272" fill="#17343B">• 当 <tspan font-family="Consolas, monospace">T = int&amp;</tspan> 时：<tspan font-family="Consolas, monospace">static_cast&lt;int&amp; &amp;&amp;&gt;</tspan> 折叠为 <tspan font-weight="700" font-family="Consolas, monospace">int&amp;</tspan>（左值）</text>
    <text x="468" y="292" fill="#17343B">• 当 <tspan font-family="Consolas, monospace">T = int</tspan> 时：<tspan font-family="Consolas, monospace">static_cast&lt;int&amp;&amp;&gt;</tspan> 还原为 <tspan font-weight="700" font-family="Consolas, monospace">int&amp;&amp;</tspan>（右值）</text>
    <text x="468" y="313" fill="#287B73" font-weight="700">• 区别：std::move 无条件转右值；forward 按 T 转换</text>
  </g>
</svg>