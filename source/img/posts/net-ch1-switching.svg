<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-label="三种交换方式对比：电路交换、报文交换与分组交换">
  <rect width="860" height="400" rx="8" fill="#F4F6F3" stroke="#D8E0DA" stroke-width="1.5"/>
  <text x="28" y="34" fill="#17343B" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700">图 1-1 · 三种交换方式的时序对比（A → 交换节点 B → 交换节点 C → D）</text>
  <line x1="28" y1="46" x2="832" y2="46" stroke="#CBD7CF" stroke-width="1.5"/>

  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13">
    <!-- Panel 1: Circuit Switching -->
    <rect x="28" y="62" width="252" height="318" rx="6" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.5"/>
    <text x="154" y="88" fill="#17343B" font-weight="700" text-anchor="middle">1. 电路交换</text>
    <text x="154" y="110" fill="#61747A" text-anchor="middle">建立物理专道，通信期间全程独占</text>
    <text x="64" y="136" fill="#287B73" font-weight="700" text-anchor="middle">A</text>
    <text x="124" y="136" fill="#287B73" font-weight="700" text-anchor="middle">B</text>
    <text x="184" y="136" fill="#287B73" font-weight="700" text-anchor="middle">C</text>
    <text x="244" y="136" fill="#287B73" font-weight="700" text-anchor="middle">D</text>
    <line x1="64" y1="145" x2="64" y2="338" stroke="#AEBDB7" stroke-width="1.5"/>
    <line x1="124" y1="145" x2="124" y2="338" stroke="#AEBDB7" stroke-width="1.5"/>
    <line x1="184" y1="145" x2="184" y2="338" stroke="#AEBDB7" stroke-width="1.5"/>
    <line x1="244" y1="145" x2="244" y2="338" stroke="#AEBDB7" stroke-width="1.5"/>
    <line x1="64" y1="158" x2="244" y2="186" stroke="#C47743" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="154" y="166" fill="#C47743" text-anchor="middle">建立连接</text>
    <polygon points="64,196 244,224 244,296 64,268" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
    <text x="154" y="252" fill="#17343B" font-weight="600" text-anchor="middle">比特流直达（独占线路）</text>
    <line x1="64" y1="306" x2="244" y2="332" stroke="#C47743" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="154" y="362" fill="#61747A" text-anchor="middle">突发数据静默期仍独占信道</text>

    <!-- Panel 2: Message Switching -->
    <rect x="304" y="62" width="252" height="318" rx="6" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.5"/>
    <text x="430" y="88" fill="#17343B" font-weight="700" text-anchor="middle">2. 报文交换</text>
    <text x="430" y="110" fill="#61747A" text-anchor="middle">整个报文收齐后逐跳存储转发</text>
    <text x="340" y="136" fill="#287B73" font-weight="700" text-anchor="middle">A</text>
    <text x="400" y="136" fill="#287B73" font-weight="700" text-anchor="middle">B</text>
    <text x="460" y="136" fill="#287B73" font-weight="700" text-anchor="middle">C</text>
    <text x="520" y="136" fill="#287B73" font-weight="700" text-anchor="middle">D</text>
    <line x1="340" y1="145" x2="340" y2="338" stroke="#AEBDB7" stroke-width="1.5"/>
    <line x1="400" y1="145" x2="400" y2="338" stroke="#AEBDB7" stroke-width="1.5"/>
    <line x1="460" y1="145" x2="460" y2="338" stroke="#AEBDB7" stroke-width="1.5"/>
    <line x1="520" y1="145" x2="520" y2="338" stroke="#AEBDB7" stroke-width="1.5"/>
    <polygon points="340,155 400,170 400,222 340,207" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
    <text x="370" y="194" fill="#17343B" text-anchor="middle">报文</text>
    <polygon points="400,228 460,243 460,295 400,280" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
    <text x="430" y="267" fill="#17343B" text-anchor="middle">转发</text>
    <polygon points="460,301 520,316 520,338 460,323" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
    <text x="430" y="362" fill="#61747A" text-anchor="middle">大报文占用节点缓存，转发时延大</text>

    <!-- Panel 3: Packet Switching -->
    <rect x="580" y="62" width="252" height="318" rx="6" fill="#FAFBF8" stroke="#287B73" stroke-width="2"/>
    <text x="706" y="88" fill="#287B73" font-weight="700" text-anchor="middle">3. 分组交换</text>
    <text x="706" y="110" fill="#61747A" text-anchor="middle">拆为短分组 P1/P2/P3，流水线转发</text>
    <text x="616" y="136" fill="#287B73" font-weight="700" text-anchor="middle">A</text>
    <text x="676" y="136" fill="#287B73" font-weight="700" text-anchor="middle">B</text>
    <text x="736" y="136" fill="#287B73" font-weight="700" text-anchor="middle">C</text>
    <text x="796" y="136" fill="#287B73" font-weight="700" text-anchor="middle">D</text>
    <line x1="616" y1="145" x2="616" y2="338" stroke="#AEBDB7" stroke-width="1.5"/>
    <line x1="676" y1="145" x2="676" y2="338" stroke="#AEBDB7" stroke-width="1.5"/>
    <line x1="736" y1="145" x2="736" y2="338" stroke="#AEBDB7" stroke-width="1.5"/>
    <line x1="796" y1="145" x2="796" y2="338" stroke="#AEBDB7" stroke-width="1.5"/>
    <polygon points="616,155 676,170 676,192 616,177" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
    <polygon points="676,196 736,211 736,233 676,218" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
    <polygon points="736,237 796,252 796,274 736,259" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
    <text x="646" y="179" fill="#C47743" font-weight="700" text-anchor="middle">P1</text>
    <polygon points="616,181 676,196 676,218 616,203" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
    <polygon points="676,222 736,237 736,259 676,244" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
    <polygon points="736,263 796,278 796,300 736,285" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
    <text x="646" y="205" fill="#287B73" font-weight="700" text-anchor="middle">P2</text>
    <polygon points="616,207 676,222 676,244 616,229" fill="#E8ECE9" stroke="#61747A" stroke-width="1.5"/>
    <polygon points="676,248 736,263 736,285 676,270" fill="#E8ECE9" stroke="#61747A" stroke-width="1.5"/>
    <polygon points="736,289 796,304 796,326 736,311" fill="#E8ECE9" stroke="#61747A" stroke-width="1.5"/>
    <text x="646" y="231" fill="#17343B" font-weight="700" text-anchor="middle">P3</text>
    <text x="706" y="362" fill="#287B73" font-weight="600" text-anchor="middle">多跳并发转发，引入首部与排队时延</text>
  </g>
</svg>