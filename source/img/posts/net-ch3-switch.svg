<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" role="img" aria-label="以太网交换机自学习与转发流程">
  <rect width="860" height="340" rx="8" fill="#F4F6F3" stroke="#D8E0DA" stroke-width="1.5"/>
  <text x="28" y="34" fill="#17343B" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700">图 3-2 · 以太网交换机自学习（构建 MAC 地址表）与帧转发过程</text>
  <line x1="28" y1="46" x2="832" y2="46" stroke="#CBD7CF" stroke-width="1.5"/>

  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13">
    <!-- Left topology -->
    <rect x="28" y="64" width="350" height="252" rx="6" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.5"/>
    <text x="203" y="90" fill="#17343B" font-weight="700" text-anchor="middle">网络拓扑（各接口冲突域相互隔离）</text>

    <!-- Switch center -->
    <rect x="138" y="164" width="130" height="48" rx="5" fill="#D8E6E0" stroke="#287B73" stroke-width="2"/>
    <text x="203" y="193" fill="#17343B" font-weight="700" text-anchor="middle">以太网交换机</text>

    <!-- Host A -->
    <rect x="48" y="106" width="86" height="38" rx="4" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="91" y="130" fill="#17343B" font-weight="600" text-anchor="middle">主机 A</text>
    <line x1="112" y1="144" x2="162" y2="164" stroke="#287B73" stroke-width="1.5"/>
    <text x="92" y="160" fill="#287B73" font-weight="700">接口 1</text>

    <!-- Host B -->
    <rect x="272" y="106" width="86" height="38" rx="4" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="315" y="130" fill="#17343B" font-weight="600" text-anchor="middle">主机 B</text>
    <line x1="294" y1="144" x2="244" y2="164" stroke="#287B73" stroke-width="1.5"/>
    <text x="276" y="160" fill="#287B73" font-weight="700">接口 2</text>

    <!-- Host C -->
    <rect x="160" y="254" width="86" height="38" rx="4" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="203" y="278" fill="#17343B" font-weight="600" text-anchor="middle">主机 C</text>
    <line x1="203" y1="212" x2="203" y2="254" stroke="#287B73" stroke-width="1.5"/>
    <text x="212" y="238" fill="#287B73" font-weight="700">接口 3</text>

    <!-- Right steps -->
    <rect x="398" y="64" width="434" height="252" rx="6" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="418" y="90" fill="#17343B" font-weight="700">自学习与转发规则（源地址学习、目的地址查表）</text>

    <!-- Step 1 -->
    <rect x="418" y="106" width="394" height="60" rx="4" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
    <text x="432" y="128" fill="#C47743" font-weight="700">步骤 1：A 向 B 发送帧（从接口 1 进入）</text>
    <text x="432" y="150" fill="#17343B">记录【MAC_A → 接口 1】；查表无 MAC_B，向接口 2、3 广播</text>

    <!-- Step 2 -->
    <rect x="418" y="178" width="394" height="60" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
    <text x="432" y="200" fill="#287B73" font-weight="700">步骤 2：B 向 A 回复帧（从接口 2 进入）</text>
    <text x="432" y="222" fill="#17343B">记录 [MAC_B → 接口 2]；查表命中 MAC_A，从接口 1 转发</text>

    <!-- Table summary -->
    <rect x="418" y="250" width="394" height="48" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.5"/>
    <text x="432" y="279" fill="#17343B" font-weight="600">当前转发表：MAC_A → 接口 1  |  MAC_B → 接口 2</text>
  </g>
</svg>