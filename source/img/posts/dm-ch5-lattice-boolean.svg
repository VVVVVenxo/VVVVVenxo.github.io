<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-label="格与布尔代数非分配格五元构型与判定路径">
  <rect width="860" height="360" rx="8" fill="#F4F6F3" stroke="#D8E0DA" stroke-width="1.5"/>
  <text x="28" y="34" fill="#17343B" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700">图 5-2 · 格与布尔代数：非分配格的两种五元构型与布尔代数判定路径</text>
  <line x1="28" y1="46" x2="832" y2="46" stroke="#CBD7CF" stroke-width="1.5"/>

  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13">
    <!-- Left Card: Two Forbidden 5-Element Lattices for Distributive Lattice -->
    <rect x="28" y="64" width="390" height="272" rx="6" fill="#FAFBF8" stroke="#C47743" stroke-width="1.5"/>
    <text x="223" y="90" fill="#C47743" font-weight="700" text-anchor="middle">1. 分配格判定：不含以下两种五元子格即为分配格</text>

    <!-- Diamond Lattice M3 (center x=126) -->
    <g stroke="#C47743" stroke-width="2">
      <!-- 1(126,126) to a(76,186), b(126,186), c(176,186) to 0(126,246) -->
      <line x1="126" y1="126" x2="76" y2="186"/>
      <line x1="126" y1="126" x2="126" y2="186"/>
      <line x1="126" y1="126" x2="176" y2="186"/>
      <line x1="76" y1="186" x2="126" y2="246"/>
      <line x1="126" y1="186" x2="126" y2="246"/>
      <line x1="176" y1="186" x2="126" y2="246"/>
    </g>
    <g text-anchor="middle" font-weight="700" fill="#17343B">
      <circle cx="126" cy="126" r="12" fill="#FAFBF8" stroke="#17343B" stroke-width="1.8"/><text x="126" y="131">1</text>
      <circle cx="76" cy="186" r="12" fill="#F4E6D9" stroke="#C47743" stroke-width="1.8"/><text x="76" y="191">a</text>
      <circle cx="126" cy="186" r="12" fill="#F4E6D9" stroke="#C47743" stroke-width="1.8"/><text x="126" y="191">b</text>
      <circle cx="176" cy="186" r="12" fill="#F4E6D9" stroke="#C47743" stroke-width="1.8"/><text x="176" y="191">c</text>
      <circle cx="126" cy="246" r="12" fill="#FAFBF8" stroke="#17343B" stroke-width="1.8"/><text x="126" y="251">0</text>
    </g>
    <text x="126" y="282" fill="#C47743" font-weight="700" text-anchor="middle">五元钻石格 M3</text>
    <text x="126" y="302" fill="#61747A" text-anchor="middle">a, b, c 互为补元（不唯一）</text>

    <!-- Pentagon Lattice N5 (center x=316) -->
    <g stroke="#C47743" stroke-width="2">
      <!-- 1(316,126) -> b(270,162) -> a(270,210) -> 0(316,246)
           1(316,126) -> c(362,186) -> 0(316,246) -->
      <line x1="316" y1="126" x2="270" y2="162"/>
      <line x1="270" y1="162" x2="270" y2="210"/>
      <line x1="270" y1="210" x2="316" y2="246"/>
      <line x1="316" y1="126" x2="362" y2="186"/>
      <line x1="362" y1="186" x2="316" y2="246"/>
    </g>
    <g text-anchor="middle" font-weight="700" fill="#17343B">
      <circle cx="316" cy="126" r="12" fill="#FAFBF8" stroke="#17343B" stroke-width="1.8"/><text x="316" y="131">1</text>
      <circle cx="270" cy="162" r="12" fill="#F4E6D9" stroke="#C47743" stroke-width="1.8"/><text x="270" y="167">b</text>
      <circle cx="270" cy="210" r="12" fill="#F4E6D9" stroke="#C47743" stroke-width="1.8"/><text x="270" y="215">a</text>
      <circle cx="362" cy="186" r="12" fill="#F4E6D9" stroke="#C47743" stroke-width="1.8"/><text x="362" y="191">c</text>
      <circle cx="316" cy="246" r="12" fill="#FAFBF8" stroke="#17343B" stroke-width="1.8"/><text x="316" y="251">0</text>
    </g>
    <text x="316" y="282" fill="#C47743" font-weight="700" text-anchor="middle">五元五边形格 N5</text>
    <text x="316" y="302" fill="#61747A" text-anchor="middle">c 的补元有 a 和 b 两个</text>

    <!-- Right Card: Boolean Algebra Path -->
    <rect x="438" y="64" width="394" height="272" rx="6" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="635" y="90" fill="#287B73" font-weight="700" text-anchor="middle">2. 从偏序集到布尔代数（Boolean Algebra）的演进</text>

    <rect x="450" y="108" width="370" height="44" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.2"/>
    <text x="635" y="135" fill="#17343B" text-anchor="middle"><tspan font-weight="700">① 格 (Lattice)：</tspan>任意两点均有上确界 a∨b 与下确界 a∧b</text>

    <rect x="450" y="162" width="178" height="58" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <text x="539" y="186" fill="#287B73" font-weight="700" text-anchor="middle">② 分配格</text>
    <text x="539" y="208" fill="#17343B" text-anchor="middle">∨ 与 ∧ 互相满足分配律</text>

    <rect x="642" y="162" width="178" height="58" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <text x="731" y="186" fill="#287B73" font-weight="700" text-anchor="middle">③ 有补格（基于有界格）</text>
    <text x="731" y="208" fill="#17343B" text-anchor="middle">每元素有补 a∧b=0, a∨b=1</text>

    <rect x="450" y="232" width="370" height="86" rx="4" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
    <text x="635" y="256" fill="#C47743" font-weight="700" text-anchor="middle">④ 布尔代数 = 有补分配格（每个元素的补元必唯一）</text>
    <text x="635" y="280" fill="#17343B" text-anchor="middle">• 有限布尔代数的元素个数必为 2^n（同构于幂集格 &lt;P(S), ⊆&gt;）</text>
    <text x="635" y="302" fill="#287B73" font-weight="700" text-anchor="middle">• 哈斯图必为 n 维超立方体（n=1 链，n=2 菱形，n=3 立方体）</text>
  </g>
</svg>