<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="'Microsoft YaHei', 'Noto Sans SC', sans-serif">
  <rect width="860" height="360" rx="8" fill="#F4F6F3" stroke="#D5DDD8" stroke-width="1.5"/>
  <text x="430" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#17343B">图 1-1：std::vector 三指针连续内存与倍增均摊分析 vs std::deque 分段连续中控器</text>

  <!-- 左栏：std::vector -->
  <rect x="28" y="54" width="396" height="284" rx="6" fill="#FFFFFF" stroke="#CBD7CF" stroke-width="1.5"/>
  <text x="226" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#17343B">1. std::vector 三指针布局（24B）与倍增扩容均摊 O(1)</text>

  <g font-size="13">
    <rect x="44" y="92" width="364" height="108" rx="4" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.2"/>
    <text x="56" y="112" fill="#287B73" font-weight="700">栈上对象头含 3 个指针（64 位 sizeof(vector) = 24B）：</text>
    <text x="56" y="134" fill="#17343B">• <tspan font-weight="700" font-family="Consolas, monospace">_M_start</tspan>：指向连续堆内存首元素（即 <tspan font-family="Consolas, monospace">begin()</tspan>）</text>
    <text x="56" y="155" fill="#17343B">• <tspan font-weight="700" font-family="Consolas, monospace">_M_finish</tspan>：指向已构造尾元素下一位置（即 <tspan font-family="Consolas, monospace">end()</tspan>）</text>
    <text x="56" y="175" fill="#17343B">• <tspan font-weight="700" font-family="Consolas, monospace">_M_end_of_storage</tspan>：指向已分配堆内存块的末尾边界</text>
    <text x="56" y="194" fill="#61747A">• size = finish - start；capacity = end_of_storage - start</text>

    <rect x="44" y="210" width="364" height="114" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <text x="56" y="230" fill="#287B73" font-weight="700">为什么扩容必须按几何倍数（GCC 2x / MSVC 1.5x）：</text>
    <text x="56" y="252" fill="#17343B">• 若每次满时仅增固定常数 K，连续插入 N 次总拷贝数为</text>
    <text x="56" y="272" fill="#17343B">  等差求和 <tspan font-weight="700" fill="#C47743">O(N²)</tspan>，单次 push_back 均摊退化为 O(N)</text>
    <text x="56" y="293" fill="#17343B">• 按 2 倍扩容时，总移动次数 <tspan font-family="Consolas, monospace">1+2+4+...+N/2 &lt; N</tspan>，</text>
    <text x="56" y="313" fill="#287B73" font-weight="700">  分摊到 N 次插入后，单次均摊复杂度严格为 O(1)</text>
  </g>

  <!-- 右栏：std::deque -->
  <rect x="442" y="54" width="390" height="284" rx="6" fill="#FFFFFF" stroke="#CBD7CF" stroke-width="1.5"/>
  <text x="637" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#17343B">2. std::deque 中控器（Map）分段定长缓冲区与四指针迭代器</text>

  <g font-size="13">
    <rect x="456" y="92" width="362" height="108" rx="4" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.2"/>
    <text x="468" y="112" fill="#C47743" font-weight="700">二级间接寻址架构（伪装成整体连续的分段定长数组）：</text>
    <text x="468" y="134" fill="#17343B">• <tspan font-weight="700">中控器 (_M_map)</tspan>：指针数组，初始从中间槽位启用，</text>
    <text x="468" y="154" fill="#17343B">  使头插 <tspan font-family="Consolas, monospace">push_front</tspan> 与尾插 <tspan font-family="Consolas, monospace">push_back</tspan> 均可 O(1) 挂载新块</text>
    <text x="468" y="175" fill="#17343B">• <tspan font-weight="700">定长缓冲区 (Chunk)</tspan>：每块定长（GCC 默认 512 字节）</text>
    <text x="468" y="194" fill="#61747A">• 随机访问 operator[i] 通过整除与取模在 O(1) 内两级定位</text>

    <rect x="456" y="210" width="362" height="114" rx="4" fill="#F4E6D9" stroke="#C47743" stroke-width="1.2"/>
    <text x="468" y="230" fill="#C47743" font-weight="700">_Deque_iterator 四指针结构（每个迭代器占 32 字节）：</text>
    <text x="468" y="252" fill="#17343B">1. <tspan font-weight="700" font-family="Consolas, monospace">_M_cur</tspan>：指向当前缓冲区内的当前元素</text>
    <text x="468" y="272" fill="#17343B">2. <tspan font-weight="700" font-family="Consolas, monospace">_M_first / _M_last</tspan>：当前连续缓冲块的头尾边界指针</text>
    <text x="468" y="292" fill="#17343B">3. <tspan font-weight="700" font-family="Consolas, monospace">_M_node (T**)</tspan>：反向指向中控器 map 中的对应槽位</text>
    <text x="468" y="313" fill="#287B73" font-weight="700">• 当 ++cur 达 _M_last 时，通过 ++_M_node 跳入下一块</text>
  </g>
</svg>