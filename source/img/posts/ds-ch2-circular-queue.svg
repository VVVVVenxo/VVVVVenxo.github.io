<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-label="循环队列判空判满模运算与中缀转后缀表达式规则">
  <rect width="860" height="360" rx="8" fill="#F4F6F3" stroke="#D8E0DA" stroke-width="1.5"/>
  <text x="28" y="34" fill="#17343B" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700">图 2-1 · 循环队列（模运算判空 / 判满）与栈的中缀转后缀表达式规则</text>
  <line x1="28" y1="46" x2="832" y2="46" stroke="#CBD7CF" stroke-width="1.5"/>

  <defs>
    <marker id="aT" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#287B73"/>
    </marker>
    <marker id="aO" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#C47743"/>
    </marker>
  </defs>

  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13">
    <!-- Left Panel: Circular Queue -->
    <rect x="28" y="64" width="400" height="272" rx="6" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="228" y="90" fill="#287B73" font-weight="700" text-anchor="middle">1. 循环队列（牺牲 1 个单元区分队空与队满）</text>

    <!-- Array slots [0..5] (MaxSize = 6) -->
    <!-- Occupied: [2]=A, [3]=B, [4]=C, [5]=D; [0]=empty, [1]=sacrificed slot before front=2 -->
    <g text-anchor="middle">
      <rect x="52"  y="124" width="58" height="38" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.2"/>
      <text x="81"  y="116" fill="#61747A">[0]</text><text x="81"  y="148" fill="#17343B" font-weight="700">E</text>

      <rect x="110" y="124" width="58" height="38" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
      <text x="139" y="116" fill="#C47743" font-weight="700">[1] 空闲</text><text x="139" y="148" fill="#C47743" font-weight="700">(牺牲)</text>

      <rect x="168" y="124" width="58" height="38" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
      <text x="197" y="116" fill="#287B73" font-weight="700">[2]</text><text x="197" y="148" fill="#17343B" font-weight="700">A</text>

      <rect x="226" y="124" width="58" height="38" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
      <text x="255" y="116" fill="#61747A">[3]</text><text x="255" y="148" fill="#17343B" font-weight="700">B</text>

      <rect x="284" y="124" width="58" height="38" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
      <text x="313" y="116" fill="#61747A">[4]</text><text x="313" y="148" fill="#17343B" font-weight="700">C</text>

      <rect x="342" y="124" width="58" height="38" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
      <text x="371" y="116" fill="#61747A">[5]</text><text x="371" y="148" fill="#17343B" font-weight="700">D</text>
    </g>

    <!-- Pointers rear=1, front=2 -->
    <line x1="139" y1="186" x2="139" y2="166" stroke="#C47743" stroke-width="2" marker-end="url(#aO)"/>
    <text x="139" y="202" fill="#C47743" font-weight="700" text-anchor="middle">rear = 1</text>

    <line x1="197" y1="186" x2="197" y2="166" stroke="#287B73" stroke-width="2" marker-end="url(#aT)"/>
    <text x="197" y="202" fill="#287B73" font-weight="700" text-anchor="middle">front = 2</text>

    <!-- Formula Box -->
    <rect x="46" y="214" width="364" height="106" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.2"/>
    <text x="60" y="236" fill="#17343B" font-weight="700">• 队空条件：<tspan fill="#287B73">Q.front == Q.rear</tspan></text>
    <text x="60" y="258" fill="#17343B" font-weight="700">• 队满条件：<tspan fill="#C47743">(Q.rear + 1) % MaxSize == Q.front</tspan></text>
    <text x="60" y="280" fill="#17343B" font-weight="700">• 队列长度：<tspan fill="#287B73">(Q.rear - Q.front + MaxSize) % MaxSize</tspan></text>
    <text x="60" y="302" fill="#61747A">• 入队/出队指针步进：ptr = (ptr + 1) % MaxSize</text>

    <!-- Right Panel: Infix to Postfix -->
    <rect x="448" y="64" width="384" height="272" rx="6" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.5"/>
    <text x="640" y="90" fill="#17343B" font-weight="700" text-anchor="middle">2. 栈的应用：中缀表达式转后缀表达式（逆波兰式）</text>

    <rect x="466" y="106" width="348" height="54" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <text x="640" y="128" fill="#17343B" font-weight="700" text-anchor="middle">中缀：A + B * (C - D) - E / F</text>
    <text x="640" y="150" fill="#287B73" font-weight="700" text-anchor="middle">后缀：A B C D - * + E F / -</text>

    <rect x="466" y="172" width="348" height="148" rx="4" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.2"/>
    <text x="480" y="196" fill="#17343B" font-weight="700">转换与求值四条核心法则：</text>
    <text x="480" y="220" fill="#17343B">① <tspan font-weight="700">操作数</tspan>：保持相对顺序不变，直接加入后缀表达式</text>
    <text x="480" y="242" fill="#17343B">② <tspan font-weight="700">界限符</tspan>：遇 <tspan font-weight="700">'('</tspan> 直接入栈；遇 <tspan font-weight="700">')'</tspan> 依次弹栈输出直到 <tspan font-weight="700">'('</tspan></text>
    <text x="480" y="264" fill="#C47743" font-weight="700">③ 运算符：弹出栈顶所有“优先级 ≥ 当前算符”的算符</text>
    <text x="480" y="284" fill="#61747A">   （遇到左括号停止），再将当前运算符压入运算符栈</text>
    <text x="480" y="306" fill="#287B73" font-weight="700">④ 后缀求值：遇算符弹出栈顶两个数，先弹为右操作数</text>
  </g>
</svg>