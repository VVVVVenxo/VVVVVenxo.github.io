<svg xmlns="http://www.w3.org/2000/svg" width="860" height="350" viewBox="0 0 860 350" role="img" aria-label="信道复用技术对比：频分复用FDM、时分复用TDM与统计时分复用STDM">
  <rect width="860" height="350" rx="8" fill="#F4F6F3" stroke="#D8E0DA" stroke-width="1.5"/>
  <text x="28" y="34" fill="#17343B" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700">图 2-2 · 物理层信道复用技术对比（FDM / TDM / 统计时分复用 STDM）</text>
  <line x1="28" y1="46" x2="832" y2="46" stroke="#CBD7CF" stroke-width="1.5"/>

  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13">
    <!-- Box 1: FDM -->
    <rect x="28" y="62" width="252" height="264" rx="6" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.5"/>
    <text x="154" y="88" fill="#17343B" font-weight="700" text-anchor="middle">1. 频分复用 (FDM)</text>
    <text x="154" y="110" fill="#61747A" text-anchor="middle">相同时间占用不同频率带宽</text>
    <line x1="66" y1="274" x2="248" y2="274" stroke="#17343B" stroke-width="1.5"/>
    <line x1="66" y1="274" x2="66" y2="132" stroke="#17343B" stroke-width="1.5"/>
    <text x="62" y="144" fill="#61747A" text-anchor="end">频率</text>
    <text x="246" y="294" fill="#61747A" text-anchor="end">时间 →</text>
    <rect x="74" y="138" width="166" height="34" rx="3" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
    <text x="157" y="160" fill="#C47743" font-weight="700" text-anchor="middle">用户 A（频带 1）</text>
    <rect x="74" y="184" width="166" height="34" rx="3" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
    <text x="157" y="206" fill="#287B73" font-weight="700" text-anchor="middle">用户 B（频带 2）</text>
    <rect x="74" y="230" width="166" height="34" rx="3" fill="#E8ECE9" stroke="#61747A" stroke-width="1.5"/>
    <text x="157" y="252" fill="#17343B" font-weight="700" text-anchor="middle">用户 C（频带 3）</text>
    <text x="154" y="312" fill="#61747A" text-anchor="middle">光纤中的对应技术为波分复用 WDM</text>

    <!-- Box 2: TDM -->
    <rect x="304" y="62" width="252" height="264" rx="6" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.5"/>
    <text x="430" y="88" fill="#17343B" font-weight="700" text-anchor="middle">2. 同步时分复用 (TDM)</text>
    <text x="430" y="110" fill="#61747A" text-anchor="middle">固定划分时间片，无数据时时隙空置</text>
    <text x="373" y="148" fill="#61747A" text-anchor="middle">TDM 帧 1</text>
    <text x="487" y="148" fill="#61747A" text-anchor="middle">TDM 帧 2</text>
    <g transform="translate(322, 160)" font-weight="700" text-anchor="middle">
      <rect x="0" y="0" width="34" height="84" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
      <text x="17" y="47" fill="#C47743">A1</text>
      <rect x="34" y="0" width="34" height="84" fill="#FAFBF8" stroke="#AEBDB7" stroke-width="1.5" stroke-dasharray="3 2"/>
      <text x="51" y="47" fill="#AEBDB7">空</text>
      <rect x="68" y="0" width="34" height="84" fill="#E8ECE9" stroke="#61747A" stroke-width="1.5"/>
      <text x="85" y="47" fill="#17343B">C1</text>

      <rect x="114" y="0" width="34" height="84" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
      <text x="131" y="47" fill="#C47743">A2</text>
      <rect x="148" y="0" width="34" height="84" fill="#FAFBF8" stroke="#AEBDB7" stroke-width="1.5" stroke-dasharray="3 2"/>
      <text x="165" y="47" fill="#AEBDB7">空</text>
      <rect x="182" y="0" width="34" height="84" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
      <text x="199" y="47" fill="#287B73">B1</text>
    </g>
    <text x="430" y="274" fill="#C47743" font-weight="600" text-anchor="middle">空闲时隙无法被其他用户借用</text>
    <text x="430" y="312" fill="#61747A" text-anchor="middle">不同时间占用相同频带宽度</text>

    <!-- Box 3: STDM -->
    <rect x="580" y="62" width="252" height="264" rx="6" fill="#FAFBF8" stroke="#287B73" stroke-width="2"/>
    <text x="706" y="88" fill="#287B73" font-weight="700" text-anchor="middle">3. 统计时分复用 (STDM)</text>
    <text x="706" y="110" fill="#61747A" text-anchor="middle">按需动态分配时隙，消除空闲槽位</text>
    <text x="706" y="148" fill="#61747A" text-anchor="middle">有数据才分配（时隙内附带地址）</text>
    <g transform="translate(618, 160)" font-weight="700" text-anchor="middle">
      <rect x="0" y="0" width="44" height="84" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
      <text x="22" y="47" fill="#C47743">A1</text>
      <rect x="44" y="0" width="44" height="84" fill="#E8ECE9" stroke="#61747A" stroke-width="1.5"/>
      <text x="66" y="47" fill="#17343B">C1</text>
      <rect x="88" y="0" width="44" height="84" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
      <text x="110" y="47" fill="#C47743">A2</text>
      <rect x="132" y="0" width="44" height="84" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
      <text x="154" y="47" fill="#287B73">B1</text>
    </g>
    <text x="706" y="274" fill="#287B73" font-weight="600" text-anchor="middle">紧凑无空隙，提高信道利用率</text>
    <text x="706" y="312" fill="#17343B" text-anchor="middle">异步按需复用</text>
  </g>
</svg>