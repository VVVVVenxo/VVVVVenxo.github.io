<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-label="DNS递归查询与迭代查询完整流程">
  <rect width="860" height="360" rx="8" fill="#F4F6F3" stroke="#D8E0DA" stroke-width="1.5"/>
  <text x="28" y="34" fill="#17343B" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700">图 6-1 · DNS 域名解析流程（主机向本地域名服务器递归查询，本地域名服务器迭代查询）</text>
  <line x1="28" y1="46" x2="832" y2="46" stroke="#CBD7CF" stroke-width="1.5"/>

  <defs>
    <marker id="arrT" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#287B73"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#C47743"/>
    </marker>
  </defs>

  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13">
    <!-- Host -->
    <rect x="44" y="164" width="144" height="62" rx="5" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="116" y="190" fill="#17343B" font-weight="700" text-anchor="middle">请求主机</text>
    <text x="116" y="212" fill="#61747A" text-anchor="middle">查询 www.abc.com</text>

    <!-- Local DNS -->
    <rect x="316" y="164" width="168" height="62" rx="5" fill="#D8E6E0" stroke="#287B73" stroke-width="2"/>
    <text x="400" y="190" fill="#17343B" font-weight="700" text-anchor="middle">本地域名服务器</text>
    <text x="400" y="212" fill="#287B73" font-weight="600" text-anchor="middle">Local DNS（缓存/代理）</text>

    <!-- Root DNS -->
    <rect x="646" y="66" width="170" height="52" rx="5" fill="#FAFBF8" stroke="#C47743" stroke-width="1.5"/>
    <text x="731" y="88" fill="#C47743" font-weight="700" text-anchor="middle">1. 根域名服务器</text>
    <text x="731" y="108" fill="#61747A" text-anchor="middle">返回 .com 顶级服务器地址</text>

    <!-- TLD DNS -->
    <rect x="646" y="168" width="170" height="52" rx="5" fill="#FAFBF8" stroke="#C47743" stroke-width="1.5"/>
    <text x="731" y="190" fill="#C47743" font-weight="700" text-anchor="middle">2. 顶级域名服务器 (.com)</text>
    <text x="731" y="210" fill="#61747A" text-anchor="middle">返回 abc.com 权限服务器</text>

    <!-- Auth DNS -->
    <rect x="646" y="270" width="170" height="52" rx="5" fill="#FAFBF8" stroke="#C47743" stroke-width="1.5"/>
    <text x="731" y="292" fill="#C47743" font-weight="700" text-anchor="middle">3. 权限域名服务器</text>
    <text x="731" y="312" fill="#61747A" text-anchor="middle">返回目标主机真实 IP 地址</text>

    <!-- Recursive arrows (Host <-> Local DNS) -->
    <line x1="188" y1="184" x2="310" y2="184" stroke="#287B73" stroke-width="2" marker-end="url(#arrT)"/>
    <text x="252" y="175" fill="#287B73" font-weight="700" text-anchor="middle">① 递归查询</text>

    <line x1="316" y1="208" x2="194" y2="208" stroke="#287B73" stroke-width="2" marker-end="url(#arrT)"/>
    <text x="252" y="228" fill="#287B73" font-weight="700" text-anchor="middle">⑧ 返回最终 IP</text>

    <!-- Iterative arrows (Local DNS <-> Root / TLD / Auth) -->
    <line x1="484" y1="174" x2="640" y2="86" stroke="#C47743" stroke-width="1.8" marker-end="url(#arrO)"/>
    <line x1="646" y1="100" x2="490" y2="184" stroke="#61747A" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="540" y="106" fill="#C47743" font-weight="700" text-anchor="middle">② / ③ 查根</text>

    <line x1="484" y1="190" x2="640" y2="190" stroke="#C47743" stroke-width="1.8" marker-end="url(#arrO)"/>
    <line x1="646" y1="204" x2="490" y2="204" stroke="#61747A" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="564" y="182" fill="#C47743" font-weight="700" text-anchor="middle">④ / ⑤ 查顶级</text>

    <line x1="484" y1="212" x2="640" y2="290" stroke="#C47743" stroke-width="1.8" marker-end="url(#arrO)"/>
    <line x1="646" y1="304" x2="490" y2="222" stroke="#61747A" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="540" y="294" fill="#C47743" font-weight="700" text-anchor="middle">⑥ / ⑦ 查权限</text>
  </g>
</svg>