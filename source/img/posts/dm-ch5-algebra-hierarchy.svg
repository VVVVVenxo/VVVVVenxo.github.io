<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-label="代数结构五层公理演进与特殊元素运算表特征">
  <rect width="860" height="360" rx="8" fill="#F4F6F3" stroke="#D8E0DA" stroke-width="1.5"/>
  <text x="28" y="34" fill="#17343B" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700">图 5-1 · 代数结构五层公理演进（广群 → 阿贝尔群）与拉格朗日定理</text>
  <line x1="28" y1="46" x2="832" y2="46" stroke="#CBD7CF" stroke-width="1.5"/>

  <defs>
    <marker id="aT" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#287B73"/>
    </marker>
  </defs>

  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13">
    <!-- Left Panel: 5-level Hierarchy -->
    <rect x="28" y="64" width="400" height="272" rx="6" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="228" y="90" fill="#287B73" font-weight="700" text-anchor="middle">1. 代数系统 &lt;G, *&gt; 的五层公理递进</text>

    <!-- Level 1: Magma -->
    <rect x="52" y="106" width="352" height="32" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.2"/>
    <text x="64" y="127" fill="#17343B" font-weight="700">① 广群 (Magma)</text>
    <text x="196" y="127" fill="#61747A">仅满足：二元运算封闭性</text>

    <!-- Level 2: Semigroup -->
    <rect x="52" y="148" width="352" height="32" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.2"/>
    <text x="64" y="169" fill="#17343B" font-weight="700">② 半群 (Semigroup)</text>
    <text x="196" y="169" fill="#17343B">广群 + <tspan fill="#287B73" font-weight="700">结合律 (a*b)*c = a*(b*c)</tspan></text>

    <!-- Level 3: Monoid -->
    <rect x="52" y="190" width="352" height="32" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <text x="64" y="211" fill="#17343B" font-weight="700">③ 独异点 (Monoid)</text>
    <text x="196" y="211" fill="#17343B">半群 + <tspan fill="#287B73" font-weight="700">存在单位元（幺元 e）</tspan></text>

    <!-- Level 4: Group -->
    <rect x="52" y="232" width="352" height="32" rx="4" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
    <text x="64" y="253" fill="#C47743" font-weight="700">④ 群 (Group)</text>
    <text x="196" y="253" fill="#17343B">独异点 + <tspan fill="#C47743" font-weight="700">每元素均有逆元 x^-1</tspan></text>

    <!-- Level 5: Abelian Group -->
    <rect x="52" y="274" width="352" height="32" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
    <text x="64" y="295" fill="#287B73" font-weight="700">⑤ 阿贝尔群 (交换群)</text>
    <text x="196" y="295" fill="#17343B">群 + <tspan fill="#287B73" font-weight="700">交换律 a * b = b * a</tspan></text>

    <text x="228" y="324" fill="#61747A" text-anchor="middle">注：循环群 G = &lt;g&gt; 必为阿贝尔群；素数阶群必为循环群</text>

    <!-- Right Panel: Special Elements & Lagrange Theorem -->
    <rect x="448" y="64" width="384" height="272" rx="6" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.5"/>
    <text x="640" y="90" fill="#17343B" font-weight="700" text-anchor="middle">2. 运算表特征与群的核心定理</text>

    <rect x="466" y="106" width="348" height="102" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.2"/>
    <text x="480" y="128" fill="#17343B" font-weight="700">特殊元素在运算表中的快速识别：</text>
    <text x="480" y="150" fill="#287B73" font-weight="700">• 左幺元 el：所在行与表头行完全一致</text>
    <text x="480" y="170" fill="#287B73" font-weight="700">• 右幺元 er：所在列与表头列完全一致（同存必相等唯一）</text>
    <text x="480" y="192" fill="#C47743" font-weight="700">• 左/右零元 θ：所在行/列全为 θ 本身（群中绝无零元）</text>

    <rect x="466" y="220" width="348" height="100" rx="4" fill="#F4E6D9" stroke="#C47743" stroke-width="1.2"/>
    <text x="480" y="242" fill="#C47743" font-weight="700">群的三大必考定理：</text>
    <text x="480" y="264" fill="#17343B">• 穿脱法则：(a * b)^-1 = b^-1 * a^-1（消去律恒成立）</text>
    <text x="480" y="286" fill="#17343B" font-weight="700">• 拉格朗日定理：子群 H 的阶 |H| 必整除群 G 的阶 |G|</text>
    <text x="480" y="306" fill="#287B73" font-weight="700">• n 阶循环群生成元个数：欧拉函数 φ(n)（与 n 互质）</text>
  </g>
</svg>