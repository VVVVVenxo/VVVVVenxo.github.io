<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-label="平面图欧拉公式与哈夫曼最优二叉树构造">
  <rect width="860" height="360" rx="8" fill="#F4F6F3" stroke="#D8E0DA" stroke-width="1.5"/>
  <text x="28" y="34" fill="#17343B" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700">图 4-2 · 平面图欧拉公式（K5 / K3,3 判定）与哈夫曼树（Huffman）构造</text>
  <line x1="28" y1="46" x2="832" y2="46" stroke="#CBD7CF" stroke-width="1.5"/>

  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13">
    <!-- Left Card: Planar Graph & Euler Formula -->
    <rect x="28" y="64" width="388" height="272" rx="6" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.5"/>
    <text x="222" y="90" fill="#17343B" font-weight="700" text-anchor="middle">1. 连通平面图欧拉公式与极小非平面图</text>

    <rect x="46" y="106" width="352" height="58" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <text x="222" y="128" fill="#287B73" font-weight="700" text-anchor="middle">欧拉公式：顶点数 n - 边数 m + 面数 r = 2</text>
    <text x="222" y="150" fill="#17343B" text-anchor="middle">次数定理：Σ deg(Ri) = 2m  |  简单平面图边数上限：m ≤ 3n - 6</text>

    <rect x="46" y="176" width="352" height="142" rx="4" fill="#F4E6D9" stroke="#C47743" stroke-width="1.2"/>
    <text x="222" y="198" fill="#C47743" font-weight="700" text-anchor="middle">库拉托夫斯基定理：非平面图必含 K5 或 K3,3 同胚子图</text>
    <text x="62" y="224" fill="#17343B" font-weight="700">• K5（5 阶完全图）：n = 5, m = 10</text>
    <text x="62" y="244" fill="#61747A">  因 3n - 6 = 9，而 m = 10 &gt; 9，故 K5 必为非平面图</text>
    <text x="62" y="272" fill="#17343B" font-weight="700">• K3,3（完全二分图，不含三角形）：n = 6, m = 9</text>
    <text x="62" y="292" fill="#61747A">  无三角形平面图需 m ≤ 2n - 4 = 8，因 9 &gt; 8 故非平面图</text>

    <!-- Right Card: Huffman Tree -->
    <rect x="444" y="64" width="388" height="272" rx="6" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="638" y="90" fill="#287B73" font-weight="700" text-anchor="middle">2. 最优二叉树（哈夫曼树）与前缀码构造示例</text>
    <text x="638" y="112" fill="#61747A" text-anchor="middle">权值集合 W = {2, 3, 5, 10}（每次合并最小的两个权值）</text>

    <!-- Huffman Tree Diagram -->
    <!-- Root 20(638,138) -> L:10(568,192), R:10(708,192)
         R:10(708,192) -> L:5(658,246), R:5(758,246)
         R:5(758,246) -> L:2(722,300), R:3(794,300) -->
    <g stroke="#287B73" stroke-width="2">
      <line x1="638" y1="138" x2="568" y2="192"/>
      <line x1="638" y1="138" x2="708" y2="192"/>
      <line x1="708" y1="192" x2="658" y2="246"/>
      <line x1="708" y1="192" x2="758" y2="246"/>
      <line x1="758" y1="246" x2="722" y2="300"/>
      <line x1="758" y1="246" x2="794" y2="300"/>
    </g>
    <!-- Edge 0/1 labels -->
    <g fill="#287B73" font-weight="700" text-anchor="middle">
      <text x="592" y="160">0</text><text x="684" y="160">1</text>
      <text x="674" y="216">0</text><text x="742" y="216">1</text>
      <text x="732" y="272">0</text><text x="784" y="272">1</text>
    </g>

    <!-- Tree Nodes -->
    <g text-anchor="middle" font-weight="700">
      <circle cx="638" cy="138" r="15" fill="#FAFBF8" stroke="#287B73" stroke-width="2"/><text x="638" y="143" fill="#17343B">20</text>
      <circle cx="568" cy="192" r="15" fill="#F4E6D9" stroke="#C47743" stroke-width="2"/><text x="568" y="197" fill="#C47743">10</text>
      <circle cx="708" cy="192" r="15" fill="#FAFBF8" stroke="#287B73" stroke-width="2"/><text x="708" y="197" fill="#17343B">10</text>
      <circle cx="658" cy="246" r="15" fill="#F4E6D9" stroke="#C47743" stroke-width="2"/><text x="658" y="251" fill="#C47743">5</text>
      <circle cx="758" cy="246" r="15" fill="#FAFBF8" stroke="#287B73" stroke-width="2"/><text x="758" y="251" fill="#17343B">5</text>
      <circle cx="722" cy="300" r="15" fill="#F4E6D9" stroke="#C47743" stroke-width="2"/><text x="722" y="305" fill="#C47743">2</text>
      <circle cx="794" cy="300" r="15" fill="#F4E6D9" stroke="#C47743" stroke-width="2"/><text x="794" y="305" fill="#C47743">3</text>
    </g>

    <!-- Left side of Right Card: Summary box -->
    <rect x="460" y="224" width="174" height="94" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.2"/>
    <text x="470" y="246" fill="#17343B" font-weight="700">带权路径长度 WPL：</text>
    <text x="470" y="268" fill="#287B73" font-weight="700">10×1 + 5×2 + (2+3)×3</text>
    <text x="470" y="288" fill="#C47743" font-weight="700">= 35（非叶节点权值和）</text>
    <text x="470" y="308" fill="#61747A">正则二叉树：叶 t = i + 1</text>
  </g>
</svg>