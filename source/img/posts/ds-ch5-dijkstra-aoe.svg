<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-label="Dijkstra最短路径松弛与AOE网关键路径四参数求解">
  <rect width="860" height="360" rx="8" fill="#F4F6F3" stroke="#D8E0DA" stroke-width="1.5"/>
  <text x="28" y="34" fill="#17343B" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700">图 5-2 · 最短路径（Dijkstra vs Floyd）与 AOE 网关键路径四参数求解</text>
  <line x1="28" y1="46" x2="832" y2="46" stroke="#CBD7CF" stroke-width="1.5"/>

  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13">
    <!-- Left Panel: Shortest Path -->
    <rect x="28" y="64" width="390" height="272" rx="6" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="223" y="90" fill="#287B73" font-weight="700" text-anchor="middle">1. 最短路径算法：Dijkstra 与 Floyd 核心机制</text>

    <rect x="46" y="108" width="354" height="104" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <text x="60" y="130" fill="#287B73" font-weight="700">• Dijkstra 算法（单源最短路径 · 贪心松弛）：</text>
    <text x="60" y="152" fill="#17343B">  松弛方程：<tspan font-weight="700">dist[v] = min(dist[v], dist[u] + w(u, v))</tspan></text>
    <text x="60" y="174" fill="#17343B">  时间复杂度：朴素 <tspan font-weight="700" fill="#287B73">O(V²)</tspan>  |  最小堆优化 <tspan font-weight="700" fill="#287B73">O((V + E) log2 V)</tspan></text>
    <text x="60" y="196" fill="#C47743" font-weight="700">  核心限制：严禁包含负权边（负权会导致已确定点被再次缩短）</text>

    <rect x="46" y="222" width="354" height="98" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.2"/>
    <text x="60" y="244" fill="#17343B" font-weight="700">• Floyd-Warshall 算法（全源最短路径 · 动态规划）：</text>
    <text x="60" y="266" fill="#17343B">  转移：<tspan font-weight="700">A[i][j] = min(A[i][j], A[i][k] + A[k][j])</tspan> (k最外层)</text>
    <text x="60" y="288" fill="#287B73" font-weight="700">  时间复杂度：O(V³)，空间复杂度：O(V²)</text>
    <text x="60" y="308" fill="#61747A">  适用限制：允许包含负权边，但不能包含总权值为负的回路</text>

    <!-- Right Panel: AOE Critical Path -->
    <rect x="438" y="64" width="394" height="272" rx="6" fill="#FAFBF8" stroke="#C47743" stroke-width="1.5"/>
    <text x="635" y="90" fill="#C47743" font-weight="700" text-anchor="middle">2. AOE 网（顶点表事件、边表活动）关键路径四步求法</text>

    <rect x="456" y="108" width="358" height="46" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <text x="470" y="128" fill="#287B73" font-weight="700">① 事件最早发生时间 ve(j)（按拓扑序从前往后取 max）：</text>
    <text x="470" y="146" fill="#17343B">ve(源点) = 0 ， ve(j) = max{ ve(i) + w(&lt;i, j&gt;) }</text>

    <rect x="456" y="162" width="358" height="46" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <text x="470" y="182" fill="#287B73" font-weight="700">② 事件最迟发生时间 vl(i)（按逆拓扑序从后往前取 min）：</text>
    <text x="470" y="200" fill="#17343B">vl(汇点) = ve(汇点) ， vl(i) = min{ vl(j) - w(&lt;i, j&gt;) }</text>

    <rect x="456" y="216" width="358" height="46" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.2"/>
    <text x="470" y="236" fill="#17343B" font-weight="700">③ 活动 a_k = &lt;i, j&gt; 的最早 e(k) 与最迟开始时间 l(k)：</text>
    <text x="470" y="254" fill="#17343B"><tspan font-weight="700" fill="#287B73">e(k) = ve(i)</tspan>（等于弧尾最早） ， <tspan font-weight="700" fill="#C47743">l(k) = vl(j) - w(&lt;i, j&gt;)</tspan></text>

    <rect x="456" y="270" width="358" height="50" rx="4" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
    <text x="470" y="290" fill="#C47743" font-weight="700">④ 时间余量 d(k) = l(k) - e(k) == 0 ⇒ 关键活动</text>
    <text x="470" y="310" fill="#17343B">缩短总工期必须<tspan font-weight="700">同时缩短所有关键路径</tspan>上的关键活动</text>
  </g>
</svg>