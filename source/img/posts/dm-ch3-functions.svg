<svg xmlns="http://www.w3.org/2000/svg" width="860" height="350" viewBox="0 0 860 350" role="img" aria-label="单射满射与双射的映射特征与计数条件">
  <rect width="860" height="350" rx="8" fill="#F4F6F3" stroke="#D8E0DA" stroke-width="1.5"/>
  <text x="28" y="34" fill="#17343B" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700">图 3-1 · 函数的三类基本性质：单射、满射与双射的映射特征与计数公式</text>
  <line x1="28" y1="46" x2="832" y2="46" stroke="#CBD7CF" stroke-width="1.5"/>

  <defs>
    <marker id="aT" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#287B73"/>
    </marker>
    <marker id="aO" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#C47743"/>
    </marker>
  </defs>

  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13">
    <!-- Card 1: Injection (x=28, w=256) -->
    <rect x="28" y="64" width="256" height="262" rx="6" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="156" y="90" fill="#287B73" font-weight="700" text-anchor="middle">1. 单射（Injection · 一对一）</text>
    <text x="156" y="110" fill="#17343B" text-anchor="middle">x1 ≠ x2 ⇒ f(x1) ≠ f(x2)</text>

    <!-- Sets A and B -->
    <ellipse cx="96" cy="184" rx="28" ry="54" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
    <ellipse cx="216" cy="184" rx="28" ry="54" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="96" y="124" fill="#17343B" font-weight="700" text-anchor="middle">A</text>
    <text x="216" y="124" fill="#17343B" font-weight="700" text-anchor="middle">B</text>
    <!-- Points in A (2 points) and B (3 points) -->
    <circle cx="96" cy="162" r="5" fill="#17343B"/><circle cx="96" cy="206" r="5" fill="#17343B"/>
    <circle cx="216" cy="152" r="5" fill="#287B73"/><circle cx="216" cy="184" r="5" fill="#287B73"/><circle cx="216" cy="216" r="5" fill="#AEBDB7"/>
    <line x1="103" y1="162" x2="207" y2="153" stroke="#287B73" stroke-width="1.8" marker-end="url(#aT)"/>
    <line x1="103" y1="206" x2="207" y2="185" stroke="#287B73" stroke-width="1.8" marker-end="url(#aT)"/>

    <text x="156" y="264" fill="#17343B" text-anchor="middle">不同原像必映射到不同像</text>
    <text x="156" y="286" fill="#287B73" font-weight="700" text-anchor="middle">前提：|A| = m ≤ |B| = n</text>
    <text x="156" y="308" fill="#61747A" text-anchor="middle">单射总数：P(n, m) = n! / (n-m)!</text>

    <!-- Card 2: Surjection (x=302, w=256) -->
    <rect x="302" y="64" width="256" height="262" rx="6" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.5"/>
    <text x="430" y="90" fill="#17343B" font-weight="700" text-anchor="middle">2. 满射（Surjection · 映上）</text>
    <text x="430" y="110" fill="#17343B" text-anchor="middle">ran f = B（∀y∈B ∃x∈A (f(x)=y)）</text>

    <ellipse cx="370" cy="184" rx="28" ry="54" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
    <ellipse cx="490" cy="184" rx="28" ry="54" fill="#FAFBF8" stroke="#C47743" stroke-width="1.5"/>
    <text x="370" y="124" fill="#17343B" font-weight="700" text-anchor="middle">A</text>
    <text x="490" y="124" fill="#17343B" font-weight="700" text-anchor="middle">B</text>
    <!-- Points in A (3 points) and B (2 points) -->
    <circle cx="370" cy="152" r="5" fill="#17343B"/><circle cx="370" cy="184" r="5" fill="#17343B"/><circle cx="370" cy="216" r="5" fill="#17343B"/>
    <circle cx="490" cy="164" r="5" fill="#C47743"/><circle cx="490" cy="204" r="5" fill="#C47743"/>
    <line x1="377" y1="152" x2="481" y2="163" stroke="#C47743" stroke-width="1.8" marker-end="url(#aO)"/>
    <line x1="377" y1="184" x2="481" y2="165" stroke="#C47743" stroke-width="1.8" marker-end="url(#aO)"/>
    <line x1="377" y1="216" x2="481" y2="205" stroke="#C47743" stroke-width="1.8" marker-end="url(#aO)"/>

    <text x="430" y="264" fill="#17343B" text-anchor="middle">B 中每个元素都至少有一个原像</text>
    <text x="430" y="286" fill="#C47743" font-weight="700" text-anchor="middle">前提：|A| = m ≥ |B| = n</text>
    <text x="430" y="308" fill="#61747A" text-anchor="middle">满射总数：n! × S(m, n) (斯特林数)</text>

    <!-- Card 3: Bijection (x=576, w=256) -->
    <rect x="576" y="64" width="256" height="262" rx="6" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="704" y="90" fill="#287B73" font-weight="700" text-anchor="middle">3. 双射（Bijection · 一一对应）</text>
    <text x="704" y="110" fill="#17343B" text-anchor="middle">既是单射，又是满射</text>

    <ellipse cx="644" cy="184" rx="28" ry="54" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
    <ellipse cx="764" cy="184" rx="28" ry="54" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
    <text x="644" y="124" fill="#17343B" font-weight="700" text-anchor="middle">A</text>
    <text x="764" y="124" fill="#17343B" font-weight="700" text-anchor="middle">B</text>
    <circle cx="644" cy="152" r="5" fill="#17343B"/><circle cx="644" cy="184" r="5" fill="#17343B"/><circle cx="644" cy="216" r="5" fill="#17343B"/>
    <circle cx="764" cy="152" r="5" fill="#287B73"/><circle cx="764" cy="184" r="5" fill="#287B73"/><circle cx="764" cy="216" r="5" fill="#287B73"/>
    <line x1="651" y1="152" x2="755" y2="152" stroke="#287B73" stroke-width="1.8" marker-end="url(#aT)"/>
    <line x1="651" y1="184" x2="755" y2="214" stroke="#287B73" stroke-width="1.8" marker-end="url(#aT)"/>
    <line x1="651" y1="216" x2="755" y2="186" stroke="#287B73" stroke-width="1.8" marker-end="url(#aT)"/>

    <text x="704" y="264" fill="#17343B" font-weight="600" text-anchor="middle">逆函数 f^-1 存在的唯一充要条件</text>
    <text x="704" y="286" fill="#287B73" font-weight="700" text-anchor="middle">前提：|A| = |B| = n（等势 A ≈ B）</text>
    <text x="704" y="308" fill="#61747A" text-anchor="middle">双射总数：n!（任意函数总数：n^m）</text>
  </g>
</svg>