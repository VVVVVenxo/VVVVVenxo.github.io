<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">C++ 内存管理</title>
  <desc id="desc">栈区中的指针 p 保存地址 0x04A0，并指向堆区中的 Node 对象。</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#B7C3BF" stroke-width="1" opacity=".18"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#267B76"/></marker>
  </defs>
  <rect width="1200" height="630" fill="#E8ECE9"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <path d="M585 72V558" stroke="#B7C3BF" stroke-width="1.5"/>
  <text x="78" y="104" fill="#456168" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="22" font-weight="600">C++ / 内存管理</text>
  <path d="M80 128H132" stroke="#267B76" stroke-width="5"/>
  <text x="76" y="285" fill="#17333B" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="76" font-weight="700" letter-spacing="-2">C++ 内存</text>
  <text x="76" y="374" fill="#17333B" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="76" font-weight="700" letter-spacing="-2">管理</text>
  <text x="80" y="453" fill="#5B6E72" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="23">栈上指针，指向堆中对象</text>
  <text x="650" y="137" fill="#456168" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="21" font-weight="600">地址与引用关系</text>
  <path d="M650 164H1115" stroke="#AEBBB6" stroke-width="1.5"/>
  <text x="650" y="208" fill="#267B76" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="20" font-weight="700">栈区</text>
  <text x="905" y="208" fill="#267B76" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="20" font-weight="700">堆区</text>
  <rect x="645" y="226" width="218" height="268" fill="#F0F3F0" stroke="#9EAEA9" stroke-width="2"/>
  <rect x="900" y="226" width="238" height="268" fill="#F0F3F0" stroke="#9EAEA9" stroke-width="2"/>
  <rect x="670" y="267" width="168" height="62" fill="#FFFFFF" stroke="#267B76" stroke-width="2"/>
  <text x="688" y="306" fill="#17333B" font-family="Consolas,Microsoft YaHei,sans-serif" font-size="22" font-weight="600">p = 0x04A0</text>
  <rect x="670" y="350" width="168" height="62" fill="#FFFFFF" stroke="#C0CBC6" stroke-width="1.5"/>
  <text x="688" y="389" fill="#52676C" font-family="Consolas,Microsoft YaHei,sans-serif" font-size="21">count = 3</text>
  <path d="M839 298H936" fill="none" stroke="#267B76" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="956" y="264" width="174" height="136" fill="#FFFFFF" stroke="#C67842" stroke-width="2.5"/>
  <path d="M956 310H1130" stroke="#C9D2CE" stroke-width="1.5"/>
  <text x="978" y="296" fill="#A45E32" font-family="Consolas,Microsoft YaHei,sans-serif" font-size="21" font-weight="700">Node</text>
  <text x="978" y="350" fill="#17333B" font-family="Consolas,Microsoft YaHei,sans-serif" font-size="20">value = 3</text>
  <text x="978" y="380" fill="#687A7D" font-family="Consolas,Microsoft YaHei,sans-serif" font-size="17">0x04A0</text>
  <text x="650" y="538" fill="#687A7D" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="18">变量保存地址，对象位于另一块存储区域</text>
</svg>