<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">排序算法大全</title>
  <desc id="desc">冷灰纸面上的选择排序示意：比较无序序列，并将最小值放入有序区。</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#B7C3BF" stroke-width="1" opacity=".18"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#267B76"/></marker>
  </defs>
  <rect width="1200" height="630" fill="#E8ECE9"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <path d="M585 72V558" stroke="#B7C3BF" stroke-width="1.5"/>
  <text x="78" y="104" fill="#456168" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="22" font-weight="600">技术笔记 / 算法</text>
  <path d="M80 128H132" stroke="#267B76" stroke-width="5"/>
  <text x="76" y="285" fill="#17333B" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="76" font-weight="700" letter-spacing="-2">排序算法</text>
  <text x="76" y="374" fill="#17333B" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="76" font-weight="700" letter-spacing="-2">大全</text>
  <text x="80" y="453" fill="#5B6E72" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="23">比较、移动，逐步缩小无序区</text>
  <text x="650" y="137" fill="#456168" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="21" font-weight="600">选择排序 · 第一轮</text>
  <path d="M650 164H1115" stroke="#AEBBB6" stroke-width="1.5"/>
  <text x="650" y="202" fill="#687A7D" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="18">无序序列</text>
  <line x1="670" y1="431" x2="1112" y2="431" stroke="#62767A" stroke-width="2"/>
  <g font-family="Microsoft YaHei,Noto Sans SC,sans-serif" text-anchor="middle">
    <rect x="686" y="299" width="48" height="132" fill="#A8B9B3"/><text x="710" y="286" fill="#17333B" font-size="21" font-weight="600">08</text><text x="710" y="460" fill="#687A7D" font-size="17">0</text>
    <rect x="756" y="362" width="48" height="69" fill="#A8B9B3"/><text x="780" y="349" fill="#17333B" font-size="21" font-weight="600">03</text><text x="780" y="460" fill="#687A7D" font-size="17">1</text>
    <rect x="826" y="325" width="48" height="106" fill="#A8B9B3"/><text x="850" y="312" fill="#17333B" font-size="21" font-weight="600">06</text><text x="850" y="460" fill="#687A7D" font-size="17">2</text>
    <rect x="896" y="385" width="48" height="46" fill="#C67842"/><text x="920" y="372" fill="#A45E32" font-size="21" font-weight="700">01</text><text x="920" y="460" fill="#687A7D" font-size="17">3</text>
    <rect x="966" y="344" width="48" height="87" fill="#A8B9B3"/><text x="990" y="331" fill="#17333B" font-size="21" font-weight="600">05</text><text x="990" y="460" fill="#687A7D" font-size="17">4</text>
    <rect x="1036" y="365" width="48" height="66" fill="#A8B9B3"/><text x="1060" y="352" fill="#17333B" font-size="21" font-weight="600">04</text><text x="1060" y="460" fill="#687A7D" font-size="17">5</text>
  </g>
  <text x="650" y="522" fill="#687A7D" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="18">本轮最小值</text>
  <path d="M920 474V506H817" fill="none" stroke="#267B76" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="748" y="510" width="58" height="38" fill="#267B76"/>
  <text x="777" y="536" fill="#F5F6F2" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="19" font-weight="700">01</text>
  <text x="822" y="536" fill="#456168" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="18">进入有序区</text>
