<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-label="磁盘读写访问时间三要素与四大磁盘调度算法对比">
  <rect width="860" height="360" rx="8" fill="#F4F6F3" stroke="#D8E0DA" stroke-width="1.5"/>
  <text x="28" y="34" fill="#17343B" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700">图 5-2 · 磁盘单次 I/O 时间三要素公式与四大磁臂调度算法对比</text>
  <line x1="28" y1="46" x2="832" y2="46" stroke="#CBD7CF" stroke-width="1.5"/>

  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13">
    <!-- Left Panel: Disk Access Time 3 Components -->
    <rect x="28" y="64" width="400" height="272" rx="6" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="228" y="90" fill="#287B73" font-weight="700" text-anchor="middle">1. 磁盘读写总时间 Ta = 寻道 Ts + 旋转延迟 Tr + 传输 Tt</text>

    <rect x="44" y="108" width="368" height="62" rx="4" fill="#F4E6D9" stroke="#C47743" stroke-width="1.2"/>
    <text x="56" y="130" fill="#C47743" font-weight="700">① 寻道时间 Ts（磁头径向移动到目标磁道 · 耗时占比最大）：</text>
    <text x="56" y="152" fill="#17343B">Ts = m × n + s（跨越 n 条磁道 + 启动耗时 s，磁盘调度核心）</text>

    <rect x="44" y="180" width="368" height="62" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <text x="56" y="202" fill="#287B73" font-weight="700">② 平均旋转延迟时间 Tr（等待目标扇区转到磁头下方 · 半圈）：</text>
    <text x="56" y="224" fill="#17343B">设磁盘转速为每秒 r 转，则转半圈平均耗时：<tspan font-weight="700" fill="#287B73">Tr = 1 / (2r)</tspan></text>

    <rect x="44" y="252" width="368" height="68" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.2"/>
    <text x="56" y="274" fill="#17343B" font-weight="700">③ 传输时间 Tt（磁头扫过扇区读写字节）：</text>
    <text x="56" y="296" fill="#17343B">设每条磁道容量为 N 字节，读写 b 字节耗时：<tspan font-weight="700">Tt = b / (r × N)</tspan></text>
    <text x="56" y="314" fill="#61747A">（注：扇区采用“交替编号”与“柱面错位命名”可减少旋转延迟）</text>

    <!-- Right Panel: 4 Disk Scheduling Algorithms -->
    <rect x="448" y="64" width="384" height="272" rx="6" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.5"/>
    <text x="640" y="90" fill="#17343B" font-weight="700" text-anchor="middle">2. 四大磁盘磁臂调度算法规则与饥饿辨析</text>

    <rect x="462" y="106" width="356" height="46" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.2"/>
    <text x="474" y="126" fill="#17343B" font-weight="700">① FCFS（先来先服务）：按请求到达顺序寻道</text>
    <text x="474" y="144" fill="#61747A">绝对公平无饥饿，但磁头大幅来回摆动，平均寻道距离最长</text>

    <rect x="462" y="160" width="356" height="48" rx="4" fill="#F4E6D9" stroke="#C47743" stroke-width="1.2"/>
    <text x="474" y="180" fill="#C47743" font-weight="700">② SSTF（最短寻道时间优先）：每次挑离当前最近的磁道</text>
    <text x="474" y="198" fill="#17343B" font-weight="700">贪心策略，平均寻道时间短，但<tspan fill="#C47743">唯一会导致边缘磁道“饥饿”</tspan></text>

    <rect x="462" y="216" width="356" height="48" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <text x="474" y="236" fill="#287B73" font-weight="700">③ SCAN（扫描算法 / 电梯算法）与 LOOK：</text>
    <text x="474" y="254" fill="#17343B">单向扫到底再掉头（<tspan font-weight="700">LOOK 扫到该方向最远请求即掉头</tspan>，无饥饿）</text>

    <rect x="462" y="272" width="356" height="48" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.2"/>
    <text x="474" y="292" fill="#17343B" font-weight="700">④ C-SCAN（循环扫描）与 C-LOOK：</text>
    <text x="474" y="310" fill="#61747A">仅单向扫描服务，到头后快速空移回起点，消除两端磁道响应不均</text>
  </g>
</svg>