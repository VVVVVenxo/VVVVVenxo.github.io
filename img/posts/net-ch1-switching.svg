<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" role="img" aria-label="三种交换方式对比：电路交换、报文交换与分组交换">
  <rect width="860" height="420" rx="8" fill="#F4F6F3" stroke="#D8E0DA" stroke-width="1.5"/>
  <text x="28" y="36" fill="#17343B" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="18" font-weight="700">图 1-1 · 三种交换方式的时序对比（A → 交换节点 B → 交换节点 C → D）</text>
  <line x1="28" y1="48" x2="832" y2="48" stroke="#CBD7CF" stroke-width="1.5"/>

  <!-- Panel 1: Circuit Switching -->
  <rect x="28" y="64" width="252" height="332" rx="6" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.5"/>
  <text x="154" y="90" fill="#17343B" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="middle">1. 电路交换 (Circuit Switching)</text>
  <text x="154" y="110" fill="#61747A" font-family="'Microsoft YaHei',sans-serif" font-size="12" text-anchor="middle">先拨号建立专道，通信期间全程独占</text>
  <!-- Vertical timelines A B C D -->
  <text x="64" y="136" fill="#287B73" font-family="Consolas,monospace" font-size="13" font-weight="700" text-anchor="middle">A</text>
  <text x="124" y="136" fill="#287B73" font-family="Consolas,monospace" font-size="13" font-weight="700" text-anchor="middle">B</text>
  <text x="184" y="136" fill="#287B73" font-family="Consolas,monospace" font-size="13" font-weight="700" text-anchor="middle">C</text>
  <text x="244" y="136" fill="#287B73" font-family="Consolas,monospace" font-size="13" font-weight="700" text-anchor="middle">D</text>
  <line x1="64" y1="145" x2="64" y2="355" stroke="#AEBDB7" stroke-width="1.5"/>
  <line x1="124" y1="145" x2="124" y2="355" stroke="#AEBDB7" stroke-width="1.5"/>
  <line x1="184" y1="145" x2="184" y2="355" stroke="#AEBDB7" stroke-width="1.5"/>
  <line x1="244" y1="145" x2="244" y2="355" stroke="#AEBDB7" stroke-width="1.5"/>
  <!-- Call setup -->
  <line x1="64" y1="158" x2="244" y2="188" stroke="#C47743" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="154" y="166" fill="#C47743" font-family="'Microsoft YaHei',sans-serif" font-size="11" text-anchor="middle">建立连接</text>
  <!-- Data block -->
  <polygon points="64,196 244,226 244,306 64,276" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
  <text x="154" y="256" fill="#17343B" font-family="'Microsoft YaHei',sans-serif" font-size="12" font-weight="600" text-anchor="middle">比特流连续直达 (独占线路)</text>
  <!-- Release -->
  <line x1="64" y1="316" x2="244" y2="342" stroke="#C47743" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="154" y="346" fill="#C47743" font-family="'Microsoft YaHei',sans-serif" font-size="11" text-anchor="middle">释放连接</text>
  <text x="154" y="378" fill="#61747A" font-family="'Microsoft YaHei',sans-serif" font-size="11.5" text-anchor="middle">缺点：突发数据静默期仍占着信道</text>

  <!-- Panel 2: Message Switching -->
  <rect x="304" y="64" width="252" height="332" rx="6" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.5"/>
  <text x="430" y="90" fill="#17343B" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="middle">2. 报文交换 (Message Switching)</text>
  <text x="430" y="110" fill="#61747A" font-family="'Microsoft YaHei',sans-serif" font-size="12" text-anchor="middle">整个报文收齐后，再向下一跳存储转发</text>
  <text x="340" y="136" fill="#287B73" font-family="Consolas,monospace" font-size="13" font-weight="700" text-anchor="middle">A</text>
  <text x="400" y="136" fill="#287B73" font-family="Consolas,monospace" font-size="13" font-weight="700" text-anchor="middle">B</text>
  <text x="460" y="136" fill="#287B73" font-family="Consolas,monospace" font-size="13" font-weight="700" text-anchor="middle">C</text>
  <text x="520" y="136" fill="#287B73" font-family="Consolas,monospace" font-size="13" font-weight="700" text-anchor="middle">D</text>
  <line x1="340" y1="145" x2="340" y2="355" stroke="#AEBDB7" stroke-width="1.5"/>
  <line x1="400" y1="145" x2="400" y2="355" stroke="#AEBDB7" stroke-width="1.5"/>
  <line x1="460" y1="145" x2="460" y2="355" stroke="#AEBDB7" stroke-width="1.5"/>
  <line x1="520" y1="145" x2="520" y2="355" stroke="#AEBDB7" stroke-width="1.5"/>
  <!-- Hop 1 -->
  <polygon points="340,155 400,170 400,225 340,210" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
  <text x="370" y="194" fill="#17343B" font-family="'Microsoft YaHei',sans-serif" font-size="11" text-anchor="middle">整段报文</text>
  <!-- Hop 2 -->
  <polygon points="400,232 460,247 460,302 400,287" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
  <text x="430" y="271" fill="#17343B" font-family="'Microsoft YaHei',sans-serif" font-size="11" text-anchor="middle">存储转发</text>
  <!-- Hop 3 -->
  <polygon points="460,309 520,324 520,352 460,337" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
  <text x="430" y="378" fill="#61747A" font-family="'Microsoft YaHei',sans-serif" font-size="11.5" text-anchor="middle">缺点：大报文霸占节点缓存，转发慢</text>

  <!-- Panel 3: Packet Switching -->
  <rect x="580" y="64" width="252" height="332" rx="6" fill="#FAFBF8" stroke="#287B73" stroke-width="2"/>
  <text x="706" y="90" fill="#287B73" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="middle">3. 分组交换 (Packet Switching)</text>
  <text x="706" y="110" fill="#61747A" font-family="'Microsoft YaHei',sans-serif" font-size="12" text-anchor="middle">拆成小分组 P1/P2/P3，多跳流水线并发</text>
  <text x="616" y="136" fill="#287B73" font-family="Consolas,monospace" font-size="13" font-weight="700" text-anchor="middle">A</text>
  <text x="676" y="136" fill="#287B73" font-family="Consolas,monospace" font-size="13" font-weight="700" text-anchor="middle">B</text>
  <text x="736" y="136" fill="#287B73" font-family="Consolas,monospace" font-size="13" font-weight="700" text-anchor="middle">C</text>
  <text x="796" y="136" fill="#287B73" font-family="Consolas,monospace" font-size="13" font-weight="700" text-anchor="middle">D</text>
  <line x1="616" y1="145" x2="616" y2="355" stroke="#AEBDB7" stroke-width="1.5"/>
  <line x1="676" y1="145" x2="676" y2="355" stroke="#AEBDB7" stroke-width="1.5"/>
  <line x1="736" y1="145" x2="736" y2="355" stroke="#AEBDB7" stroke-width="1.5"/>
  <line x1="796" y1="145" x2="796" y2="355" stroke="#AEBDB7" stroke-width="1.5"/>
  <!-- P1 -->
  <polygon points="616,155 676,170 676,192 616,177" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
  <polygon points="676,196 736,211 736,233 676,218" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
  <polygon points="736,237 796,252 796,274 736,259" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
  <text x="646" y="179" fill="#C47743" font-family="Consolas,monospace" font-size="11" font-weight="700" text-anchor="middle">P1</text>
  <!-- P2 -->
  <polygon points="616,181 676,196 676,218 616,203" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
  <polygon points="676,222 736,237 736,259 676,244" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
  <polygon points="736,263 796,278 796,300 736,285" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
  <text x="646" y="205" fill="#287B73" font-family="Consolas,monospace" font-size="11" font-weight="700" text-anchor="middle">P2</text>
  <!-- P3 -->
  <polygon points="616,207 676,222 676,244 616,229" fill="#E8ECE9" stroke="#61747A" stroke-width="1.5"/>
  <polygon points="676,248 736,263 736,285 676,270" fill="#E8ECE9" stroke="#61747A" stroke-width="1.5"/>
  <polygon points="736,289 796,304 796,326 736,311" fill="#E8ECE9" stroke="#61747A" stroke-width="1.5"/>
  <text x="646" y="231" fill="#17343B" font-family="Consolas,monospace" font-size="11" font-weight="700" text-anchor="middle">P3</text>
  <!-- Time saved note -->
  <line x1="796" y1="326" x2="616" y2="326" stroke="#287B73" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="706" y="346" fill="#287B73" font-family="'Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">★ B 转发 P1 的同时，A 已在发 P2</text>
  <text x="706" y="378" fill="#17343B" font-family="'Microsoft YaHei',sans-serif" font-size="11.5" text-anchor="middle">高效并发，但引入首部开销与排队时延</text>
</svg>