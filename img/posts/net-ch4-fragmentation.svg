<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-label="IP数据报分片与片偏移计算示例">
  <rect width="860" height="360" rx="8" fill="#F4F6F3" stroke="#D8E0DA" stroke-width="1.5"/>
  <text x="28" y="34" fill="#17343B" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700">图 4-2 · IP 数据报分片示例（原始数据 3800B，链路 MTU = 1420B，片偏移以 8B 为单位）</text>
  <line x1="28" y1="46" x2="832" y2="46" stroke="#CBD7CF" stroke-width="1.5"/>

  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13">
    <!-- Original datagram -->
    <text x="36" y="84" fill="#17343B" font-weight="700">原始数据报</text>
    <text x="36" y="104" fill="#61747A">总长 3820B</text>
    <rect x="140" y="66" width="80" height="44" rx="4" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
    <text x="180" y="93" fill="#C47743" font-weight="700" text-anchor="middle">首部 20B</text>
    <rect x="220" y="66" width="600" height="44" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
    <text x="520" y="93" fill="#17343B" font-weight="600" text-anchor="middle">数据部分 3800 字节（字节编号 0 ～ 3799）</text>

    <!-- Frag 1 -->
    <text x="36" y="162" fill="#17343B" font-weight="700">数据报片 1</text>
    <text x="36" y="182" fill="#61747A">总长 1420B</text>
    <rect x="140" y="144" width="80" height="44" rx="4" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
    <text x="180" y="171" fill="#C47743" font-weight="700" text-anchor="middle">首部 20B</text>
    <rect x="220" y="144" width="240" height="44" rx="4" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="340" y="171" fill="#17343B" text-anchor="middle">数据 1400B（编号 0 ～ 1399）</text>
    <text x="480" y="171" fill="#287B73" font-weight="600">MF = 1（后面还有分片） |  片偏移 = 0 / 8 = 0</text>

    <!-- Frag 2 -->
    <text x="36" y="232" fill="#17343B" font-weight="700">数据报片 2</text>
    <text x="36" y="252" fill="#61747A">总长 1420B</text>
    <rect x="140" y="214" width="80" height="44" rx="4" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
    <text x="180" y="241" fill="#C47743" font-weight="700" text-anchor="middle">首部 20B</text>
    <rect x="220" y="214" width="240" height="44" rx="4" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="340" y="241" fill="#17343B" text-anchor="middle">数据 1400B（编号 1400 ～ 2799）</text>
    <text x="480" y="241" fill="#287B73" font-weight="600">MF = 1（后面还有分片） |  片偏移 = 1400 / 8 = 175</text>

    <!-- Frag 3 -->
    <text x="36" y="302" fill="#17343B" font-weight="700">数据报片 3</text>
    <text x="36" y="322" fill="#61747A">总长 1020B</text>
    <rect x="140" y="284" width="80" height="44" rx="4" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
    <text x="180" y="311" fill="#C47743" font-weight="700" text-anchor="middle">首部 20B</text>
    <rect x="220" y="284" width="210" height="44" rx="4" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="325" y="311" fill="#17343B" text-anchor="middle">数据 1000B（2800 ～ 3799）</text>
    <text x="480" y="311" fill="#C47743" font-weight="700">MF = 0（最后一个分片） |  片偏移 = 2800 / 8 = 350</text>
  </g>
</svg>