<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-label="四大页面置换算法对比与改进型CLOCK四轮扫描优先级">
  <rect width="860" height="360" rx="8" fill="#F4F6F3" stroke="#D8E0DA" stroke-width="1.5"/>
  <text x="28" y="34" fill="#17343B" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700">图 3-3 · 四大页面置换算法（OPT / FIFO / LRU / CLOCK）与改进型 CLOCK 四轮扫描</text>
  <line x1="28" y1="46" x2="832" y2="46" stroke="#CBD7CF" stroke-width="1.5"/>

  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13">
    <!-- Left Panel: 4 Page Replacement Algorithms -->
    <rect x="28" y="64" width="400" height="272" rx="6" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="228" y="90" fill="#287B73" font-weight="700" text-anchor="middle">1. 四大页面置换算法淘汰规则与 Belady 异常</text>

    <rect x="44" y="106" width="368" height="48" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.2"/>
    <text x="56" y="126" fill="#17343B" font-weight="700">① OPT（最佳置换 · 向后看）：淘汰未来最久不访问的页</text>
    <text x="56" y="144" fill="#61747A">缺页率最低（理论最优基准），但无法预知未来故不可实现</text>

    <rect x="44" y="162" width="368" height="48" rx="4" fill="#F4E6D9" stroke="#C47743" stroke-width="1.2"/>
    <text x="56" y="182" fill="#C47743" font-weight="700">② FIFO（先进先出）：淘汰最早进入内存的页（队列实现）</text>
    <text x="56" y="200" fill="#17343B" font-weight="700">唯一产生 Belady 异常的算法（物理块增加，缺页率反升）</text>

    <rect x="44" y="218" width="368" height="48" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <text x="56" y="238" fill="#287B73" font-weight="700">③ LRU（最近最久未使用 · 向前看）：淘汰最久未访问的页</text>
    <text x="56" y="256" fill="#17343B">基于局部性原理，性能最接近 OPT（堆栈类算法，无 Belady）</text>

    <rect x="44" y="274" width="368" height="46" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.2"/>
    <text x="56" y="294" fill="#17343B" font-weight="700">④ 简单 CLOCK（二次机会）：循环扫描访问位 A</text>
    <text x="56" y="312" fill="#61747A">遇 A==1 则置 A=0 给二次机会跳过；遇 A==0 则立即淘汰</text>

    <!-- Right Panel: Enhanced CLOCK 4-Pass Scan -->
    <rect x="448" y="64" width="384" height="272" rx="6" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.5"/>
    <text x="640" y="90" fill="#17343B" font-weight="700" text-anchor="middle">2. 改进型 CLOCK 算法：(访问位 A, 修改位 M) 四轮扫描</text>

    <text x="640" y="114" fill="#C47743" font-weight="700" text-anchor="middle">核心：优先淘汰“未修改 (M=0)”干净页，省去写回磁盘 I/O</text>

    <rect x="460" y="126" width="360" height="42" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <text x="472" y="146" fill="#287B73" font-weight="700">第 1 轮扫描：找 (A = 0, M = 0) —— 未访问且未修改</text>
    <text x="472" y="162" fill="#17343B">最佳淘汰页！<tspan font-weight="700">本轮扫描过程中不修改任何页面的访问位 A</tspan></text>

    <rect x="460" y="176" width="360" height="42" rx="4" fill="#F4E6D9" stroke="#C47743" stroke-width="1.2"/>
    <text x="472" y="196" fill="#C47743" font-weight="700">第 2 轮扫描：若第 1 轮失败，找 (A = 0, M = 1) —— 未访问已改</text>
    <text x="472" y="212" fill="#17343B"><tspan font-weight="700" fill="#C47743">本轮将所有扫描途经页面的访问位 A 全部置为 0</tspan></text>

    <rect x="464" y="226" width="352" height="42" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <text x="478" y="246" fill="#287B73" font-weight="700">第 3 轮扫描：若第 2 轮失败，重新找 (A = 0, M = 0)</text>
    <text x="478" y="262" fill="#17343B">（原先的 (1, 0) 页在第 2 轮中已被清零变为 (0, 0)，本轮不改 A）</text>

    <rect x="464" y="276" width="352" height="44" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.2"/>
    <text x="478" y="296" fill="#17343B" font-weight="700">第 4 轮扫描：若第 3 轮失败，重新找 (A = 0, M = 1)（必能找到）</text>
    <text x="478" y="314" fill="#61747A">（原先的 (1, 1) 页在第 2 轮已被清零为 (0, 1)，最多四轮必命中）</text>
  </g>
</svg>