<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="'Microsoft YaHei', 'Noto Sans SC', sans-serif">
  <rect width="860" height="360" rx="8" fill="#F4F6F3" stroke="#D5DDD8" stroke-width="1.5"/>
  <text x="430" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#17343B">图 4-1：互斥锁、条件变量（虚假唤醒防护）与固定工作线程池架构</text>

  <!-- 左栏 -->
  <rect x="28" y="54" width="396" height="284" rx="6" fill="#FFFFFF" stroke="#CBD7CF" stroke-width="1.5"/>
  <text x="226" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#17343B">1. RAII 互斥锁管理与条件变量等待规范</text>

  <g font-size="13">
    <rect x="44" y="92" width="364" height="108" rx="4" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.2"/>
    <text x="56" y="112" fill="#287B73" font-weight="700">四种标准库 RAII 锁包装器对比：</text>
    <text x="56" y="134" fill="#17343B">• <tspan font-weight="700" font-family="Consolas, monospace">lock_guard</tspan>：构造加锁、析构解锁，不可手动提前解锁</text>
    <text x="56" y="155" fill="#17343B">• <tspan font-weight="700" font-family="Consolas, monospace">unique_lock</tspan>：支持延迟加锁、手动解锁与条件变量配合</text>
    <text x="56" y="175" fill="#17343B">• <tspan font-weight="700" font-family="Consolas, monospace">scoped_lock</tspan>：C++17 多互斥量同时加锁，防止死锁</text>
    <text x="56" y="194" fill="#61747A">• <tspan font-weight="700" font-family="Consolas, monospace">shared_lock</tspan>：配合 <tspan font-family="Consolas, monospace">shared_mutex</tspan> 实现多读单写共享锁</text>

    <rect x="44" y="210" width="364" height="114" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <text x="56" y="230" fill="#287B73" font-weight="700">condition_variable 虚假唤醒防护：</text>
    <text x="56" y="252" fill="#17343B">• 操作系统内核信号中断或多核竞争下，等待线程可能在</text>
    <text x="56" y="272" fill="#17343B">  没有收到通知或条件已被其他线程消费的情况下被唤醒</text>
    <text x="56" y="293" fill="#17343B">• 必须使用带条件函数的循环等待重载：</text>
    <text x="56" y="313" fill="#287B73" font-weight="700" font-family="Consolas, monospace">cv.wait(lock, [&amp;]{ return !q.empty(); });</text>
  </g>

  <!-- 右栏 -->
  <rect x="442" y="54" width="390" height="284" rx="6" fill="#FFFFFF" stroke="#CBD7CF" stroke-width="1.5"/>
  <text x="637" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#17343B">2. 异步任务（Future/Promise）与固定工作线程池</text>

  <g font-size="13">
    <rect x="456" y="92" width="362" height="108" rx="4" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.2"/>
    <text x="468" y="112" fill="#C47743" font-weight="700">std::promise / std::packaged_task / std::future：</text>
    <text x="468" y="134" fill="#17343B">• <tspan font-weight="700">提交端</tspan>：用 <tspan font-family="Consolas, monospace">packaged_task</tspan> 包装待执行函数，</text>
    <text x="468" y="154" fill="#17343B">  调用 <tspan font-family="Consolas, monospace">get_future()</tspan> 返回给外部调用者用于等待返回值</text>
    <text x="468" y="175" fill="#17343B">• 生产端与消费端通过堆上引用计数的<tspan font-weight="700">共享状态</tspan></text>
    <text x="468" y="194" fill="#61747A">  传递计算结果或跨线程重新抛出捕获到的异常</text>

    <rect x="456" y="210" width="362" height="114" rx="4" fill="#F4E6D9" stroke="#C47743" stroke-width="1.2"/>
    <text x="468" y="230" fill="#C47743" font-weight="700">工作线程池（Thread Pool）缩短持锁区间的关键规范：</text>
    <text x="468" y="252" fill="#17343B">1. 工作线程唤醒后，在锁内通过 <tspan font-family="Consolas, monospace">std::move</tspan> 取出队首</text>
    <text x="468" y="272" fill="#17343B">   任务对象，随后<tspan font-weight="700">立即释放互斥锁</tspan>，在锁外执行耗时任务函数</text>
    <text x="468" y="292" fill="#17343B">2. 析构线程池时：先加锁置 <tspan font-family="Consolas, monospace">stop = true</tspan>，解锁后调用</text>
    <text x="468" y="313" fill="#287B73" font-weight="700">   <tspan font-family="Consolas, monospace">cv.notify_all()</tspan>，再依次 <tspan font-family="Consolas, monospace">join()</tspan> 回收全部工作线程</text>
  </g>
</svg>