<svg xmlns="http://www.w3.org/2000/svg" width="860" height="410" viewBox="0 0 860 410" role="img" aria-label="数字信号常用编码波形对比：不归零制、曼彻斯特编码与差分曼彻斯特编码">
  <rect width="860" height="410" rx="8" fill="#F4F6F3" stroke="#D8E0DA" stroke-width="1.5"/>
  <text x="28" y="36" fill="#17343B" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="18" font-weight="700">图 2-1 · 基带数字信号编码对比（为什么曼彻斯特编码能自带时钟同步信号？）</text>
  <line x1="28" y1="48" x2="832" y2="48" stroke="#CBD7CF" stroke-width="1.5"/>

  <!-- Bit columns: 8 bits (1 0 1 1 0 0 1 0), x from 200 to 800, each bit = 75px -->
  <g stroke="#CBD7CF" stroke-width="1" stroke-dasharray="4 4">
    <line x1="200" y1="64" x2="200" y2="365"/>
    <line x1="275" y1="64" x2="275" y2="365"/>
    <line x1="350" y1="64" x2="350" y2="365"/>
    <line x1="425" y1="64" x2="425" y2="365"/>
    <line x1="500" y1="64" x2="500" y2="365"/>
    <line x1="575" y1="64" x2="575" y2="365"/>
    <line x1="650" y1="64" x2="650" y2="365"/>
    <line x1="725" y1="64" x2="725" y2="365"/>
    <line x1="800" y1="64" x2="800" y2="365"/>
  </g>

  <!-- Bit values header -->
  <text x="36" y="88" fill="#17343B" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700">原始比特流</text>
  <g fill="#17343B" font-family="Consolas,monospace" font-size="18" font-weight="700" text-anchor="middle">
    <text x="237.5" y="88">1</text>
    <text x="312.5" y="88">0</text>
    <text x="387.5" y="88">1</text>
    <text x="462.5" y="88">1</text>
    <text x="537.5" y="88">0</text>
    <text x="612.5" y="88">0</text>
    <text x="687.5" y="88">1</text>
    <text x="762.5" y="88">0</text>
  </g>

  <!-- Row 1: NRZ (y center = 140, high = 118, low = 162) -->
  <text x="36" y="138" fill="#17343B" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700">不归零制 (NRZ)</text>
  <text x="36" y="156" fill="#61747A" font-family="'Microsoft YaHei',sans-serif" font-size="11.5">正电平=1，负电平=0</text>
  <line x1="200" y1="140" x2="800" y2="140" stroke="#AEBDB7" stroke-width="1"/>
  <path d="M200 118 H275 V162 H350 V118 H500 V162 H650 V118 H725 V162 H800" fill="none" stroke="#61747A" stroke-width="2.8"/>
  <text x="575" y="180" fill="#C47743" font-family="'Microsoft YaHei',sans-serif" font-size="11" font-weight="600" text-anchor="middle">▲ 连续 1 或 0 时无跳变，接收端易丢失时钟同步</text>

  <!-- Row 2: Manchester (y center = 235, high = 213, low = 257) -->
  <text x="36" y="233" fill="#287B73" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700">曼彻斯特编码</text>
  <text x="36" y="251" fill="#61747A" font-family="'Microsoft YaHei',sans-serif" font-size="11.5">位中心必跳变 (前高后低=1)</text>
  <line x1="200" y1="235" x2="800" y2="235" stroke="#AEBDB7" stroke-width="1"/>
  <!-- 1(H->L), 0(L->H), 1(H->L), 1(H->L), 0(L->H), 0(L->H), 1(H->L), 0(L->H) -->
  <path d="M200 213 H237.5 V257 H312.5 V213 H387.5 V257 H425 V213 H462.5 V257 H537.5 V213 H575 V257 H612.5 V213 H687.5 V257 H762.5 V213 H800" fill="none" stroke="#287B73" stroke-width="2.8"/>
  <!-- Highlight mid-bit transitions -->
  <g fill="#C47743">
    <circle cx="237.5" cy="235" r="3.5"/><circle cx="312.5" cy="235" r="3.5"/>
    <circle cx="387.5" cy="235" r="3.5"/><circle cx="462.5" cy="235" r="3.5"/>
    <circle cx="537.5" cy="235" r="3.5"/><circle cx="612.5" cy="235" r="3.5"/>
    <circle cx="687.5" cy="235" r="3.5"/><circle cx="762.5" cy="235" r="3.5"/>
  </g>

  <!-- Row 3: Differential Manchester (y center = 325, high = 303, low = 347) -->
  <text x="36" y="323" fill="#17343B" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700">差分曼彻斯特</text>
  <text x="36" y="341" fill="#61747A" font-family="'Microsoft YaHei',sans-serif" font-size="11.5">边界跳变=0，边界不跳变=1</text>
  <line x1="200" y1="325" x2="800" y2="325" stroke="#AEBDB7" stroke-width="1"/>
  <!-- Start high->low for bit1(1): 200..237.5 H, 237.5..275 L
       bit2(0): boundary jump L->H at 275, then mid H->L at 312.5..350 L
       bit3(1): no boundary jump at 350 (stay L), mid L->H at 387.5..425 H
       bit4(1): no boundary jump at 425 (stay H), mid H->L at 462.5..500 L
       bit5(0): boundary jump L->H at 500, mid H->L at 537.5..575 L
       bit6(0): boundary jump L->H at 575, mid H->L at 612.5..650 L
       bit7(1): no boundary jump at 650 (stay L), mid L->H at 687.5..725 H
       bit8(0): boundary jump H->L at 725, mid L->H at 762.5..800 H -->
  <path d="M200 303 H237.5 V347 H275 V303 H312.5 V347 H387.5 V303 H462.5 V347 H500 V303 H537.5 V347 H575 V303 H612.5 V347 H687.5 V303 H725 V347 H762.5 V303 H800" fill="none" stroke="#17343B" stroke-width="2.5"/>

  <text x="430" y="392" fill="#61747A" font-family="'Microsoft YaHei',sans-serif" font-size="12" text-anchor="middle">注：曼彻斯特编码每个码元中心必有一次电平跳变（橙点），既表示数据又提供自同步时钟，传统 10Mbps 以太网即采用此编码。</text>
</svg>