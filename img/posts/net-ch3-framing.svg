<svg xmlns="http://www.w3.org/2000/svg" width="860" height="390" viewBox="0 0 860 390" role="img" aria-label="透明传输字节填充与以太网V2的MAC帧格式">
  <rect width="860" height="390" rx="8" fill="#F4F6F3" stroke="#D8E0DA" stroke-width="1.5"/>
  <text x="28" y="34" fill="#17343B" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700">图 3-1 · 透明传输（字节填充）与以太网 V2 的 MAC 帧结构</text>
  <line x1="28" y1="46" x2="832" y2="46" stroke="#CBD7CF" stroke-width="1.5"/>

  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13">
    <!-- Part 1: Byte Stuffing -->
    <rect x="28" y="62" width="804" height="142" rx="6" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.5"/>
    <text x="48" y="88" fill="#17343B" font-weight="700">1. 透明传输 · 字节填充（在数据中出现的控制字符前插入转义字符 ESC）</text>

    <text x="48" y="124" fill="#61747A">填充前数据：</text>
    <rect x="136" y="104" width="60" height="30" rx="3" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
    <text x="166" y="124" fill="#287B73" font-weight="700" text-anchor="middle">SOH</text>
    <rect x="196" y="104" width="90" height="30" rx="3" fill="#FAFBF8" stroke="#AEBDB7" stroke-width="1.5"/>
    <text x="241" y="124" fill="#17343B" text-anchor="middle">数据 A</text>
    <rect x="286" y="104" width="76" height="30" rx="3" fill="#FAFBF8" stroke="#C47743" stroke-width="1.5"/>
    <text x="324" y="124" fill="#C47743" font-weight="700" text-anchor="middle">EOT</text>
    <rect x="362" y="104" width="90" height="30" rx="3" fill="#FAFBF8" stroke="#AEBDB7" stroke-width="1.5"/>
    <text x="407" y="124" fill="#17343B" text-anchor="middle">数据 B</text>
    <rect x="452" y="104" width="76" height="30" rx="3" fill="#FAFBF8" stroke="#C47743" stroke-width="1.5"/>
    <text x="490" y="124" fill="#C47743" font-weight="700" text-anchor="middle">ESC</text>
    <rect x="528" y="104" width="90" height="30" rx="3" fill="#FAFBF8" stroke="#AEBDB7" stroke-width="1.5"/>
    <text x="573" y="124" fill="#17343B" text-anchor="middle">数据 C</text>
    <rect x="618" y="104" width="60" height="30" rx="3" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
    <text x="648" y="124" fill="#287B73" font-weight="700" text-anchor="middle">EOT</text>

    <text x="48" y="172" fill="#61747A">填充后发送：</text>
    <rect x="136" y="152" width="60" height="30" rx="3" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
    <text x="166" y="172" fill="#287B73" font-weight="700" text-anchor="middle">SOH</text>
    <rect x="196" y="152" width="84" height="30" rx="3" fill="#FAFBF8" stroke="#AEBDB7" stroke-width="1.5"/>
    <text x="238" y="172" fill="#17343B" text-anchor="middle">数据 A</text>
    <rect x="280" y="152" width="56" height="30" rx="3" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
    <text x="308" y="172" fill="#C47743" font-weight="700" text-anchor="middle">ESC</text>
    <rect x="336" y="152" width="64" height="30" rx="3" fill="#FAFBF8" stroke="#AEBDB7" stroke-width="1.5"/>
    <text x="368" y="172" fill="#17343B" text-anchor="middle">EOT</text>
    <rect x="400" y="152" width="84" height="30" rx="3" fill="#FAFBF8" stroke="#AEBDB7" stroke-width="1.5"/>
    <text x="442" y="172" fill="#17343B" text-anchor="middle">数据 B</text>
    <rect x="484" y="152" width="56" height="30" rx="3" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
    <text x="512" y="172" fill="#C47743" font-weight="700" text-anchor="middle">ESC</text>
    <rect x="540" y="152" width="64" height="30" rx="3" fill="#FAFBF8" stroke="#AEBDB7" stroke-width="1.5"/>
    <text x="572" y="172" fill="#17343B" text-anchor="middle">ESC</text>
    <rect x="604" y="152" width="84" height="30" rx="3" fill="#FAFBF8" stroke="#AEBDB7" stroke-width="1.5"/>
    <text x="646" y="172" fill="#17343B" text-anchor="middle">数据 C</text>
    <rect x="688" y="152" width="60" height="30" rx="3" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
    <text x="718" y="172" fill="#287B73" font-weight="700" text-anchor="middle">EOT</text>

    <!-- Part 2: Ethernet V2 Frame -->
    <rect x="28" y="220" width="804" height="150" rx="6" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="48" y="246" fill="#17343B" font-weight="700">2. 以太网 V2 的 MAC 帧格式（MAC 帧有效长度：64 ～ 1518 字节）</text>

    <!-- Fields -->
    <rect x="48" y="264" width="116" height="46" rx="3" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="106" y="284" fill="#61747A" font-weight="700" text-anchor="middle">前同步码</text>
    <text x="106" y="302" fill="#61747A" text-anchor="middle">8 字节（物理层）</text>

    <rect x="164" y="264" width="116" height="46" rx="3" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
    <text x="222" y="284" fill="#C47743" font-weight="700" text-anchor="middle">目的地址</text>
    <text x="222" y="302" fill="#17343B" text-anchor="middle">6 字节</text>

    <rect x="280" y="264" width="116" height="46" rx="3" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
    <text x="338" y="284" fill="#C47743" font-weight="700" text-anchor="middle">源地址</text>
    <text x="338" y="302" fill="#17343B" text-anchor="middle">6 字节</text>

    <rect x="396" y="264" width="86" height="46" rx="3" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
    <text x="439" y="284" fill="#C47743" font-weight="700" text-anchor="middle">类型</text>
    <text x="439" y="302" fill="#17343B" text-anchor="middle">2 字节</text>

    <rect x="482" y="264" width="224" height="46" rx="3" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
    <text x="594" y="284" fill="#17343B" font-weight="700" text-anchor="middle">数据字段（IP 数据报）</text>
    <text x="594" y="302" fill="#287B73" font-weight="600" text-anchor="middle">46 ～ 1500 字节</text>

    <rect x="706" y="264" width="96" height="46" rx="3" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
    <text x="754" y="284" fill="#C47743" font-weight="700" text-anchor="middle">FCS</text>
    <text x="754" y="302" fill="#17343B" text-anchor="middle">4 字节</text>

    <!-- Brace / range note -->
    <line x1="164" y1="326" x2="802" y2="326" stroke="#287B73" stroke-width="1.5"/>
    <line x1="164" y1="320" x2="164" y2="332" stroke="#287B73" stroke-width="1.5"/>
    <line x1="802" y1="320" x2="802" y2="332" stroke="#287B73" stroke-width="1.5"/>
    <text x="483" y="348" fill="#287B73" font-weight="600" text-anchor="middle">MAC 帧长 = 首部(14B) + 数据(46~1500B) + 尾部(4B) = 64 ～ 1518 字节（不足 46B 时填充至 46B）</text>
  </g>
</svg>