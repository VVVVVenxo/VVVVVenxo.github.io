<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-label="二元关系五种基本性质在关系矩阵与关系图上的判定特征">
  <rect width="860" height="360" rx="8" fill="#F4F6F3" stroke="#D8E0DA" stroke-width="1.5"/>
  <text x="28" y="34" fill="#17343B" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700">图 2-1 · 二元关系的五种基本性质：关系矩阵与关系图判定特征对照</text>
  <line x1="28" y1="46" x2="832" y2="46" stroke="#CBD7CF" stroke-width="1.5"/>

  <defs>
    <marker id="aT" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#287B73"/>
    </marker>
    <marker id="aO" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#C47743"/>
    </marker>
  </defs>

  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13">
    <!-- 5 cards: width 152 each, gap 11 => 5*152 + 4*11 = 760 + 44 = 804 (x from 28 to 832) -->
    <!-- Card 1: Reflexive (x=28) -->
    <rect x="28" y="64" width="152" height="272" rx="6" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="104" y="90" fill="#287B73" font-weight="700" text-anchor="middle">1. 自反性</text>
    <text x="104" y="112" fill="#17343B" text-anchor="middle">∀x (xRx)</text>
    <rect x="44" y="128" width="120" height="62" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <text x="104" y="154" fill="#17343B" font-weight="700" text-anchor="middle">矩阵主对角线</text>
    <text x="104" y="176" fill="#287B73" font-weight="700" text-anchor="middle">全为 1</text>
    <!-- Self loop nodes -->
    <circle cx="76" cy="246" r="12" fill="#FAFBF8" stroke="#17343B" stroke-width="1.8"/>
    <path d="M68,236 C56,214 96,214 84,236" fill="none" stroke="#287B73" stroke-width="1.8" marker-end="url(#aT)"/>
    <circle cx="132" cy="246" r="12" fill="#FAFBF8" stroke="#17343B" stroke-width="1.8"/>
    <path d="M124,236 C112,214 152,214 140,236" fill="none" stroke="#287B73" stroke-width="1.8" marker-end="url(#aT)"/>
    <text x="104" y="294" fill="#61747A" text-anchor="middle">关系图每个顶点</text>
    <text x="104" y="314" fill="#17343B" font-weight="600" text-anchor="middle">均有自环</text>

    <!-- Card 2: Irreflexive (x=191) -->
    <rect x="191" y="64" width="152" height="272" rx="6" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.5"/>
    <text x="267" y="90" fill="#17343B" font-weight="700" text-anchor="middle">2. 反自反性</text>
    <text x="267" y="112" fill="#17343B" text-anchor="middle">∀x (¬xRx)</text>
    <rect x="207" y="128" width="120" height="62" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.2"/>
    <text x="267" y="154" fill="#17343B" font-weight="700" text-anchor="middle">矩阵主对角线</text>
    <text x="267" y="176" fill="#C47743" font-weight="700" text-anchor="middle">全为 0</text>
    <circle cx="239" cy="246" r="12" fill="#FAFBF8" stroke="#17343B" stroke-width="1.8"/>
    <circle cx="295" cy="246" r="12" fill="#FAFBF8" stroke="#17343B" stroke-width="1.8"/>
    <line x1="251" y1="246" x2="281" y2="246" stroke="#287B73" stroke-width="1.8" marker-end="url(#aT)"/>
    <text x="267" y="294" fill="#61747A" text-anchor="middle">关系图每个顶点</text>
    <text x="267" y="314" fill="#17343B" font-weight="600" text-anchor="middle">均无自环</text>

    <!-- Card 3: Symmetric (x=354) -->
    <rect x="354" y="64" width="152" height="272" rx="6" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="430" y="90" fill="#287B73" font-weight="700" text-anchor="middle">3. 对称性</text>
    <text x="430" y="112" fill="#17343B" text-anchor="middle">xRy ⇒ yRx</text>
    <rect x="370" y="128" width="120" height="62" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <text x="430" y="154" fill="#17343B" font-weight="700" text-anchor="middle">对称矩阵</text>
    <text x="430" y="176" fill="#287B73" font-weight="700" text-anchor="middle">M = M^T</text>
    <circle cx="396" cy="246" r="12" fill="#FAFBF8" stroke="#17343B" stroke-width="1.8"/>
    <circle cx="464" cy="246" r="12" fill="#FAFBF8" stroke="#17343B" stroke-width="1.8"/>
    <path d="M407,239 Q430,226 451,239" fill="none" stroke="#287B73" stroke-width="1.8" marker-end="url(#aT)"/>
    <path d="M453,253 Q430,266 409,253" fill="none" stroke="#287B73" stroke-width="1.8" marker-end="url(#aT)"/>
    <text x="430" y="294" fill="#61747A" text-anchor="middle">异点间若有边</text>
    <text x="430" y="314" fill="#17343B" font-weight="600" text-anchor="middle">必为成对双向边</text>

    <!-- Card 4: Antisymmetric (x=517) -->
    <rect x="517" y="64" width="152" height="272" rx="6" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.5"/>
    <text x="593" y="90" fill="#17343B" font-weight="700" text-anchor="middle">4. 反对称性</text>
    <text x="593" y="112" fill="#17343B" text-anchor="middle">xRy ∧ yRx ⇒ x=y</text>
    <rect x="533" y="128" width="120" height="62" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.2"/>
    <text x="593" y="154" fill="#17343B" font-weight="700" text-anchor="middle">非对角线对称位</text>
    <text x="593" y="176" fill="#C47743" font-weight="700" text-anchor="middle">不同时为 1</text>
    <circle cx="559" cy="246" r="12" fill="#FAFBF8" stroke="#17343B" stroke-width="1.8"/>
    <circle cx="627" cy="246" r="12" fill="#FAFBF8" stroke="#17343B" stroke-width="1.8"/>
    <line x1="571" y1="246" x2="613" y2="246" stroke="#C47743" stroke-width="1.8" marker-end="url(#aO)"/>
    <text x="593" y="294" fill="#61747A" text-anchor="middle">异点间若有边</text>
    <text x="593" y="314" fill="#17343B" font-weight="600" text-anchor="middle">只能是单向边</text>

    <!-- Card 5: Transitive (x=680) -->
    <rect x="680" y="64" width="152" height="272" rx="6" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="756" y="90" fill="#287B73" font-weight="700" text-anchor="middle">5. 传递性</text>
    <text x="756" y="112" fill="#17343B" text-anchor="middle">xRy ∧ yRz ⇒ xRz</text>
    <rect x="696" y="128" width="120" height="62" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <text x="756" y="154" fill="#17343B" font-weight="700" text-anchor="middle">矩阵布尔平方</text>
    <text x="756" y="176" fill="#287B73" font-weight="700" text-anchor="middle">M² ⊆ M</text>
    <circle cx="720" cy="260" r="10" fill="#FAFBF8" stroke="#17343B" stroke-width="1.8"/>
    <circle cx="756" cy="218" r="10" fill="#FAFBF8" stroke="#17343B" stroke-width="1.8"/>
    <circle cx="792" cy="260" r="10" fill="#FAFBF8" stroke="#17343B" stroke-width="1.8"/>
    <line x1="727" y1="252" x2="748" y2="227" stroke="#287B73" stroke-width="1.6" marker-end="url(#aT)"/>
    <line x1="764" y1="227" x2="785" y2="252" stroke="#287B73" stroke-width="1.6" marker-end="url(#aT)"/>
    <line x1="730" y1="260" x2="780" y2="260" stroke="#C47743" stroke-width="2" marker-end="url(#aO)"/>
    <text x="756" y="294" fill="#61747A" text-anchor="middle">凡有两步可达路径</text>
    <text x="756" y="314" fill="#C47743" font-weight="700" text-anchor="middle">必有一步直达边</text>
  </g>
</svg>