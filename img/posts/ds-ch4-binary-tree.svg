<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-label="中序线索二叉树与左孩子右兄弟树森林转换法则">
  <rect width="860" height="360" rx="8" fill="#F4F6F3" stroke="#D8E0DA" stroke-width="1.5"/>
  <text x="28" y="34" fill="#17343B" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700">图 4-1 · 中序线索二叉树（利用 n+1 个空链域）与“左孩子右兄弟”转换法则</text>
  <line x1="28" y1="46" x2="832" y2="46" stroke="#CBD7CF" stroke-width="1.5"/>

  <defs>
    <marker id="aT" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#287B73"/>
    </marker>
    <marker id="aO" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#C47743"/>
    </marker>
  </defs>

  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13">
    <!-- Left Panel: Threaded Binary Tree -->
    <rect x="28" y="64" width="390" height="272" rx="6" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="223" y="90" fill="#287B73" font-weight="700" text-anchor="middle">1. 线索二叉树节点结构与中序前驱 / 后继查找</text>

    <!-- Node structure diagram -->
    <g text-anchor="middle">
      <rect x="52"  y="108" width="58" height="34" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
      <text x="81"  y="130" fill="#287B73" font-weight="700">lchild</text>
      <rect x="110" y="108" width="48" height="34" fill="#F4E6D9" stroke="#C47743" stroke-width="1.2"/>
      <text x="134" y="130" fill="#C47743" font-weight="700">ltag</text>
      <rect x="158" y="108" width="130" height="34" fill="#FAFBF8" stroke="#17343B" stroke-width="1.5"/>
      <text x="223" y="130" fill="#17343B" font-weight="700">data（数据域）</text>
      <rect x="288" y="108" width="48" height="34" fill="#F4E6D9" stroke="#C47743" stroke-width="1.2"/>
      <text x="312" y="130" fill="#C47743" font-weight="700">rtag</text>
      <rect x="336" y="108" width="58" height="34" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
      <text x="365" y="130" fill="#287B73" font-weight="700">rchild</text>
    </g>

    <text x="223" y="164" fill="#17343B" text-anchor="middle">tag=0 指左/右孩子；<tspan fill="#C47743" font-weight="700">tag=1 指前驱/后继线索（共 n+1 个）</tspan></text>

    <rect x="46" y="178" width="354" height="142" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.2"/>
    <text x="60" y="200" fill="#17343B" font-weight="700">中序线索二叉树（左 → 根 → 右）定位法则：</text>
    <text x="60" y="224" fill="#287B73" font-weight="700">• 找节点 p 的中序后继（Next）：</text>
    <text x="60" y="244" fill="#17343B">  rtag==1 直接取 rchild；rtag==0 取<tspan font-weight="700" fill="#287B73">右子树最左下节点</tspan></text>
    <text x="60" y="270" fill="#C47743" font-weight="700">• 找节点 p 的中序前驱（Prior）：</text>
    <text x="60" y="290" fill="#17343B">  ltag==1 直接取 lchild；ltag==0 取<tspan font-weight="700" fill="#C47743">左子树最右下节点</tspan></text>
    <text x="60" y="310" fill="#61747A">注：先序线索找前驱、后序线索找后继需借助双亲指针</text>

    <!-- Right Panel: Child-Sibling Representation -->
    <rect x="438" y="64" width="394" height="272" rx="6" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.5"/>
    <text x="635" y="90" fill="#17343B" font-weight="700" text-anchor="middle">2. 树与二叉树转换：“左孩子、右兄弟”表示法</text>

    <!-- Left mini tree: General Tree A -> B, C, D; B -> E, F -->
    <text x="530" y="114" fill="#61747A" font-weight="700" text-anchor="middle">原普通树 T</text>
    <g stroke="#287B73" stroke-width="1.8">
      <line x1="530" y1="136" x2="480" y2="180"/>
      <line x1="530" y1="136" x2="530" y2="180"/>
      <line x1="530" y1="136" x2="580" y2="180"/>
      <line x1="480" y1="180" x2="462" y2="224"/>
      <line x1="480" y1="180" x2="502" y2="224"/>
    </g>
    <g text-anchor="middle" font-weight="700" fill="#17343B">
      <circle cx="530" cy="136" r="12" fill="#D8E6E0" stroke="#287B73" stroke-width="1.6"/><text x="530" y="141">A</text>
      <circle cx="480" cy="180" r="12" fill="#FAFBF8" stroke="#287B73" stroke-width="1.6"/><text x="480" y="185">B</text>
      <circle cx="530" cy="180" r="12" fill="#FAFBF8" stroke="#287B73" stroke-width="1.6"/><text x="530" y="185">C</text>
      <circle cx="580" cy="180" r="12" fill="#FAFBF8" stroke="#287B73" stroke-width="1.6"/><text x="580" y="185">D</text>
      <circle cx="462" cy="224" r="12" fill="#FAFBF8" stroke="#287B73" stroke-width="1.6"/><text x="462" y="229">E</text>
      <circle cx="502" cy="224" r="12" fill="#FAFBF8" stroke="#287B73" stroke-width="1.6"/><text x="502" y="229">F</text>
    </g>

    <!-- Arrow between trees -->
    <line x1="606" y1="180" x2="642" y2="180" stroke="#C47743" stroke-width="2" marker-end="url(#aO)"/>

    <!-- Right mini tree: Binary Tree A(710,128) -> L:B(674,162) -> L:E(648,198)->R:F(678,228), B->R:C(716,196)->R:D(754,228) -->
    <text x="728" y="114" fill="#287B73" font-weight="700" text-anchor="middle">对应二叉树 BT（左孩右兄）</text>
    <g stroke="#287B73" stroke-width="1.8">
      <line x1="710" y1="134" x2="674" y2="166"/>
      <line x1="674" y1="166" x2="648" y2="200"/>
    </g>
    <g stroke="#C47743" stroke-width="1.8">
      <line x1="674" y1="166" x2="720" y2="196"/>
      <line x1="720" y1="196" x2="764" y2="226"/>
      <line x1="648" y1="200" x2="684" y2="226"/>
    </g>
    <g text-anchor="middle" font-weight="700" fill="#17343B">
      <circle cx="710" cy="134" r="11" fill="#D8E6E0" stroke="#287B73" stroke-width="1.6"/><text x="710" y="139">A</text>
      <circle cx="674" cy="166" r="11" fill="#FAFBF8" stroke="#287B73" stroke-width="1.6"/><text x="674" y="171">B</text>
      <circle cx="648" cy="200" r="11" fill="#FAFBF8" stroke="#287B73" stroke-width="1.6"/><text x="648" y="205">E</text>
      <circle cx="684" cy="226" r="11" fill="#F4E6D9" stroke="#C47743" stroke-width="1.6"/><text x="684" y="231">F</text>
      <circle cx="720" cy="196" r="11" fill="#F4E6D9" stroke="#C47743" stroke-width="1.6"/><text x="720" y="201">C</text>
      <circle cx="764" cy="226" r="11" fill="#F4E6D9" stroke="#C47743" stroke-width="1.6"/><text x="764" y="231">D</text>
    </g>

    <rect x="454" y="248" width="362" height="72" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <text x="468" y="270" fill="#17343B" font-weight="700">• 树的先根遍历 / 森林先序遍历 ⇔ 二叉树的<tspan fill="#287B73">先序遍历</tspan></text>
    <text x="468" y="292" fill="#17343B" font-weight="700">• 树的后根遍历 / 森林中序遍历 ⇔ 二叉树的<tspan fill="#C47743">中序遍历</tspan></text>
    <text x="468" y="312" fill="#61747A">• 森林叶节点总数 = 对应二叉树中左指针为空的节点数</text>
  </g>
</svg>