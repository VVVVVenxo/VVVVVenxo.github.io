<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-label="进程五状态转换图与进程线程资源边界对比">
  <rect width="860" height="360" rx="8" fill="#F4F6F3" stroke="#D8E0DA" stroke-width="1.5"/>
  <text x="28" y="34" fill="#17343B" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700">图 2-1 · 进程五状态转换模型与进程 / 线程底层资源边界对比</text>
  <line x1="28" y1="46" x2="832" y2="46" stroke="#CBD7CF" stroke-width="1.5"/>

  <defs>
    <marker id="aT" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#287B73"/>
    </marker>
    <marker id="aO" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#C47743"/>
    </marker>
  </defs>

  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13">
    <!-- Left Panel: 5-State Transition Diagram -->
    <rect x="28" y="64" width="420" height="272" rx="6" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="238" y="90" fill="#287B73" font-weight="700" text-anchor="middle">1. 进程五状态转换图（注意单向与双向箭头）</text>

    <!-- Nodes: New(66,132), Ready(164,132), Running(316,132),Terminated(398,132), Blocked(240,236) -->
    <g text-anchor="middle" font-weight="700">
      <rect x="44"  y="116" width="56" height="32" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.4"/><text x="72"  y="137" fill="#17343B">创建态</text>
      <rect x="132" y="116" width="68" height="32" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.8"/><text x="166" y="137" fill="#287B73">就绪态</text>
      <rect x="276" y="116" width="68" height="32" rx="4" fill="#F4E6D9" stroke="#C47743" stroke-width="1.8"/><text x="310" y="137" fill="#C47743">运行态</text>
      <rect x="376" y="116" width="56" height="32" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.4"/><text x="404" y="137" fill="#17343B">终止态</text>
      <rect x="204" y="218" width="68" height="32" rx="4" fill="#FAFBF8" stroke="#17343B" stroke-width="1.8"/><text x="238" y="239" fill="#17343B">阻塞态</text>
    </g>

    <!-- Transitions -->
    <line x1="100" y1="132" x2="128" y2="132" stroke="#287B73" stroke-width="1.6" marker-end="url(#aT)"/>
    <line x1="344" y1="132" x2="372" y2="132" stroke="#17343B" stroke-width="1.6" marker-end="url(#aT)"/>

    <!-- Ready <-> Running -->
    <path d="M200,124 Q238,108 272,124" fill="none" stroke="#287B73" stroke-width="1.8" marker-end="url(#aT)"/>
    <text x="238" y="112" fill="#287B73" font-weight="700" text-anchor="middle">调度指派 CPU</text>
    <path d="M276,140 Q238,156 204,140" fill="none" stroke="#C47743" stroke-width="1.8" marker-end="url(#aO)"/>
    <text x="238" y="166" fill="#C47743" font-weight="700" text-anchor="middle">时间片到/被抢占</text>

    <!-- Running -> Blocked -> Ready -->
    <path d="M310,148 Q310,224 276,232" fill="none" stroke="#C47743" stroke-width="1.8" marker-end="url(#aO)"/>
    <text x="348" y="204" fill="#C47743" font-weight="700" text-anchor="middle">等待事件 (主动)</text>

    <path d="M204,232 Q166,224 166,152" fill="none" stroke="#287B73" stroke-width="1.8" marker-end="url(#aT)"/>
    <text x="124" y="204" fill="#287B73" font-weight="700" text-anchor="middle">事件完成 (被动)</text>

    <rect x="44" y="264" width="388" height="56" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.2"/>
    <text x="56" y="286" fill="#17343B" font-weight="700">• 只差 CPU：<tspan fill="#287B73">就绪态</tspan>  |  等待非 CPU 资源 / 事件：<tspan fill="#C47743">阻塞态</tspan></text>
    <text x="56" y="308" fill="#C47743" font-weight="700">• 严禁发生的非法转换：就绪态 → 阻塞态、阻塞态 → 运行态</text>

    <!-- Right Panel: Process vs Thread -->
    <rect x="464" y="64" width="368" height="272" rx="6" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.5"/>
    <text x="648" y="90" fill="#17343B" font-weight="700" text-anchor="middle">2. 进程与线程的资源边界及切换开销</text>

    <rect x="476" y="108" width="344" height="102" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <text x="488" y="130" fill="#287B73" font-weight="700">进程（资源分配基本单位 · 独立地址空间）：</text>
    <text x="488" y="152" fill="#17343B">• <tspan font-weight="700">同进程线程共享</tspan>：代码段、全局/静态变量、</text>
    <text x="488" y="172" fill="#17343B">  堆内存（Heap）、打开文件表（fd）、信号处理</text>
    <text x="488" y="194" fill="#C47743" font-weight="700">• 每个线程独享：线程栈（Stack）、PC、寄存器</text>

    <rect x="476" y="220" width="344" height="100" rx="4" fill="#F4E6D9" stroke="#C47743" stroke-width="1.2"/>
    <text x="488" y="242" fill="#C47743" font-weight="700">为何进程切换比同进程内线程切换慢得多：</text>
    <text x="488" y="264" fill="#17343B">① 进程切换必须<tspan font-weight="700">切换页表基址寄存器 (CR3)</tspan> 更换</text>
    <text x="488" y="284" fill="#17343B">   虚拟地址空间，导致 <tspan font-weight="700" fill="#C47743">TLB（快表）全部失效冲刷</tspan></text>
    <text x="488" y="304" fill="#61747A">② 切回后频繁触发 TLB Miss；而线程共享同一页表</text>
  </g>
</svg>