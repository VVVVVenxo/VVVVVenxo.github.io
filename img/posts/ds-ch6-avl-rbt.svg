<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-label="AVL树四种失衡旋转与红黑树五条性质对比">
  <rect width="860" height="360" rx="8" fill="#F4F6F3" stroke="#D8E0DA" stroke-width="1.5"/>
  <text x="28" y="34" fill="#17343B" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700">图 6-1 · 平衡二叉树（AVL 四种旋转调整）与红黑树（RBT 五条性质与工程权衡）</text>
  <line x1="28" y1="46" x2="832" y2="46" stroke="#CBD7CF" stroke-width="1.5"/>

  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13">
    <!-- Left Panel: AVL 4 Rotations -->
    <rect x="28" y="64" width="400" height="272" rx="6" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="228" y="90" fill="#287B73" font-weight="700" text-anchor="middle">1. AVL 树（|BF| = |hL - hR| ≤ 1）四种失衡旋转法则</text>

    <!-- 2x2 grid for LL, RR, LR, RL -->
    <rect x="46" y="106" width="176" height="92" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <text x="134" y="128" fill="#287B73" font-weight="700" text-anchor="middle">① LL 型（左孩子的左子树）</text>
    <text x="134" y="152" fill="#17343B" font-weight="700" text-anchor="middle">操作：右单旋</text>
    <text x="134" y="176" fill="#61747A" text-anchor="middle">左孩子 B 上升为新根</text>

    <rect x="234" y="106" width="176" height="92" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <text x="322" y="128" fill="#287B73" font-weight="700" text-anchor="middle">② RR 型（右孩子的右子树）</text>
    <text x="322" y="152" fill="#17343B" font-weight="700" text-anchor="middle">操作：左单旋</text>
    <text x="322" y="176" fill="#61747A" text-anchor="middle">右孩子 B 上升为新根</text>

    <rect x="46" y="210" width="176" height="108" rx="4" fill="#F4E6D9" stroke="#C47743" stroke-width="1.2"/>
    <text x="134" y="232" fill="#C47743" font-weight="700" text-anchor="middle">③ LR 型（左孩子的右子树）</text>
    <text x="134" y="256" fill="#17343B" font-weight="700" text-anchor="middle">操作：先左旋后右旋</text>
    <text x="134" y="278" fill="#C47743" font-weight="700" text-anchor="middle">孙子节点 C 上升为新根</text>
    <text x="134" y="300" fill="#61747A" text-anchor="middle">（先对 B 左旋，再对 A 右旋）</text>

    <rect x="234" y="210" width="176" height="108" rx="4" fill="#F4E6D9" stroke="#C47743" stroke-width="1.2"/>
    <text x="322" y="232" fill="#C47743" font-weight="700" text-anchor="middle">④ RL 型（右孩子的左子树）</text>
    <text x="322" y="256" fill="#17343B" font-weight="700" text-anchor="middle">操作：先右旋后左旋</text>
    <text x="322" y="278" fill="#C47743" font-weight="700" text-anchor="middle">孙子节点 C 上升为新根</text>
    <text x="322" y="300" fill="#61747A" text-anchor="middle">（先对 B 右旋，再对 A 左旋）</text>

    <!-- Right Panel: Red-Black Tree -->
    <rect x="448" y="64" width="384" height="272" rx="6" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.5"/>
    <text x="640" y="90" fill="#17343B" font-weight="700" text-anchor="middle">2. 红黑树（Red-Black Tree）五条性质与 AVL 对比</text>

    <rect x="458" y="106" width="364" height="118" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.2"/>
    <text x="470" y="128" fill="#17343B" font-weight="700">口诀：“左根右、根叶黑、不红红、黑路同”</text>
    <text x="470" y="150" fill="#17343B">① 节点非红即黑；② <tspan font-weight="700">根必黑</tspan>；③ <tspan font-weight="700">外部空叶节点 (NIL) 必黑</tspan></text>
    <text x="470" y="172" fill="#C47743" font-weight="700">④ 不红红：红色节点的父节点与孩子都必须是黑色</text>
    <text x="470" y="194" fill="#287B73" font-weight="700">⑤ 黑路同：任一节点到各空叶路径上的黑节点数相同</text>
    <text x="470" y="214" fill="#61747A">推论：最长路径 ≤ 2 × 最短路径，树高 h ≤ 2 log2(n+1)</text>

    <rect x="458" y="234" width="364" height="84" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <text x="470" y="256" fill="#287B73" font-weight="700">工程选型（为何 std::map 用红黑树而非 AVL）：</text>
    <text x="470" y="278" fill="#17343B">• AVL 严格平衡，但删除节点最多需 <tspan fill="#C47743" font-weight="700">O(log2 n) 次旋转</tspan></text>
    <text x="470" y="300" fill="#17343B">• 红黑树适度平衡，<tspan fill="#287B73" font-weight="700">插入最多 2 次、删除最多 3 次旋转 O(1)</tspan></text>
  </g>
</svg>