<svg xmlns="http://www.w3.org/2000/svg" width="860" height="350" viewBox="0 0 860 350" role="img" aria-label="TCP以字节为单位的发送滑动窗口结构">
  <rect width="860" height="350" rx="8" fill="#F4F6F3" stroke="#D8E0DA" stroke-width="1.5"/>
  <text x="28" y="34" fill="#17343B" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700">图 5-1 · TCP 以字节为单位的发送滑动窗口（当前确认号 ack = 34，窗口大小 = 8 字节）</text>
  <line x1="28" y1="46" x2="832" y2="46" stroke="#CBD7CF" stroke-width="1.5"/>

  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13">
    <!-- Window outer box (covering bytes 34..41, i=3..10, x=230 + 3*44 = 362, width = 8*44 = 352) -->
    <rect x="356" y="106" width="364" height="76" rx="6" fill="none" stroke="#287B73" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="538" y="94" fill="#287B73" font-weight="700" text-anchor="middle">发送窗口 W = min(rwnd, cwnd) = 8 字节</text>

    <!-- Byte cells: 31 to 45 (15 cells, each width 44, x start = 100) -->
    <!-- Group 1: 31,32,33 (x = 224, 268, 312) Sent & Acked -->
    <g transform="translate(224, 120)" text-anchor="middle" font-weight="700">
      <rect x="0" y="0" width="44" height="48" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.5"/><text x="22" y="29" fill="#61747A">31</text>
      <rect x="44" y="0" width="44" height="48" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.5"/><text x="66" y="29" fill="#61747A">32</text>
      <rect x="88" y="0" width="44" height="48" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.5"/><text x="110" y="29" fill="#61747A">33</text>

      <!-- Group 2: 34,35,36 (x = 132, 176, 220) Sent but not Acked -->
      <rect x="132" y="0" width="44" height="48" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/><text x="154" y="29" fill="#C47743">34</text>
      <rect x="176" y="0" width="44" height="48" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/><text x="198" y="29" fill="#C47743">35</text>
      <rect x="220" y="0" width="44" height="48" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/><text x="242" y="29" fill="#C47743">36</text>

      <!-- Group 3: 37,38,39,40,41 (x = 264..440) Can send -->
      <rect x="264" y="0" width="44" height="48" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/><text x="286" y="29" fill="#287B73">37</text>
      <rect x="308" y="0" width="44" height="48" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/><text x="330" y="29" fill="#287B73">38</text>
      <rect x="352" y="0" width="44" height="48" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/><text x="374" y="29" fill="#287B73">39</text>
      <rect x="396" y="0" width="44" height="48" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/><text x="418" y="29" fill="#287B73">40</text>
      <rect x="440" y="0" width="44" height="48" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/><text x="462" y="29" fill="#287B73">41</text>

      <!-- Group 4: 42,43,44 (x = 484..572) Cannot send -->
      <rect x="484" y="0" width="44" height="48" fill="#FAFBF8" stroke="#AEBDB7" stroke-width="1.5"/><text x="506" y="29" fill="#61747A">42</text>
      <rect x="528" y="0" width="44" height="48" fill="#FAFBF8" stroke="#AEBDB7" stroke-width="1.5"/><text x="550" y="29" fill="#61747A">43</text>
      <rect x="572" y="0" width="44" height="48" fill="#FAFBF8" stroke="#AEBDB7" stroke-width="1.5"/><text x="594" y="29" fill="#61747A">44</text>
    </g>

    <text x="118" y="149" fill="#17343B" font-weight="700" text-anchor="middle">发送缓存字节序号 →</text>

    <!-- Pointers P1, P2, P3 -->
    <line x1="356" y1="184" x2="356" y2="218" stroke="#17343B" stroke-width="2"/>
    <text x="356" y="236" fill="#17343B" font-weight="700" text-anchor="middle">P1（窗口后沿）</text>

    <line x1="488" y1="184" x2="488" y2="218" stroke="#C47743" stroke-width="2"/>
    <text x="488" y="236" fill="#C47743" font-weight="700" text-anchor="middle">P2（下一待发）</text>

    <line x1="708" y1="184" x2="708" y2="218" stroke="#287B73" stroke-width="2"/>
    <text x="708" y="236" fill="#287B73" font-weight="700" text-anchor="middle">P3（窗口前沿）</text>

    <!-- Legend boxes -->
    <rect x="38" y="264" width="186" height="54" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.5"/>
    <text x="131" y="286" fill="#17343B" font-weight="700" text-anchor="middle">① 31～33：已发送并确认</text>
    <text x="131" y="306" fill="#61747A" text-anchor="middle">可从发送缓存中删除</text>

    <rect x="238" y="264" width="194" height="54" rx="4" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
    <text x="335" y="286" fill="#C47743" font-weight="700" text-anchor="middle">② 34～36：已发送未确认</text>
    <text x="335" y="306" fill="#17343B" text-anchor="middle">P2 - P1（需暂存以备超时重传）</text>

    <rect x="446" y="264" width="194" height="54" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
    <text x="543" y="286" fill="#287B73" font-weight="700" text-anchor="middle">③ 37～41：允许立即发送</text>
    <text x="543" y="306" fill="#17343B" text-anchor="middle">P3 - P2（可用窗口）</text>

    <rect x="654" y="264" width="174" height="54" rx="4" fill="#FAFBF8" stroke="#AEBDB7" stroke-width="1.5"/>
    <text x="741" y="286" fill="#17343B" font-weight="700" text-anchor="middle">④ 42～44：不允许发送</text>
    <text x="741" y="306" fill="#61747A" text-anchor="middle">需等待窗口右移</text>
  </g>
</svg>