<svg xmlns="http://www.w3.org/2000/svg" width="860" height="370" viewBox="0 0 860 370" role="img" aria-label="快速排序枢轴划分与大根堆下滤建堆及内部排序复杂度对比">
  <rect width="860" height="370" rx="8" fill="#F4F6F3" stroke="#D8E0DA" stroke-width="1.5"/>
  <text x="28" y="34" fill="#17343B" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700">图 7-1 · 快速排序 Partition 双指针划分、堆排序建堆与内部排序核心对比</text>
  <line x1="28" y1="46" x2="832" y2="46" stroke="#CBD7CF" stroke-width="1.5"/>

  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13">
    <!-- Top Left: Quick Sort Partition -->
    <rect x="28" y="62" width="390" height="142" rx="6" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="223" y="86" fill="#287B73" font-weight="700" text-anchor="middle">1. 快速排序 Partition（每趟将枢轴放到最终正确位置）</text>

    <g text-anchor="middle">
      <rect x="52"  y="100" width="110" height="30" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
      <text x="107" y="120" fill="#287B73" font-weight="700">&lt; pivot 左子表</text>
      <rect x="168" y="100" width="110" height="30" fill="#F4E6D9" stroke="#C47743" stroke-width="1.8"/>
      <text x="223" y="120" fill="#C47743" font-weight="700">pivot (最终位)</text>
      <rect x="284" y="100" width="110" height="30" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
      <text x="339" y="120" fill="#287B73" font-weight="700">≥ pivot 右子表</text>
    </g>
    <text x="223" y="154" fill="#17343B" text-anchor="middle">平均：<tspan font-weight="700" fill="#287B73">时间 O(n log2 n)，栈空间 O(log2 n)</tspan></text>
    <text x="223" y="176" fill="#C47743" font-weight="700" text-anchor="middle">最坏（初始有序/逆序）：时间 O(n²)，栈空间 O(n)</text>
    <text x="223" y="194" fill="#61747A" text-anchor="middle">不稳定 | 内部排序平均最快，可通过“三数取中”消除最坏情况</text>

    <!-- Top Right: Heap Sort -->
    <rect x="438" y="62" width="394" height="142" rx="6" fill="#FAFBF8" stroke="#C47743" stroke-width="1.5"/>
    <text x="635" y="86" fill="#C47743" font-weight="700" text-anchor="middle">2. 堆排序（大根堆 L[i] ≥ L[2i] 且 L[i] ≥ L[2i+1]）</text>
    <text x="454" y="114" fill="#17343B">• <tspan font-weight="700" fill="#287B73">自底向上建初堆</tspan>：从最后分支点 <tspan font-weight="700">i = ⌊n/2⌋</tspan> 递减到 1 下滤，</text>
    <text x="454" y="134" fill="#287B73" font-weight="700">  建初堆时间复杂度严格为线性 O(n)（比较次数 ≤ 4n）</text>
    <text x="454" y="158" fill="#17343B">• <tspan font-weight="700" fill="#C47743">排序与维护</tspan>：每次堆顶 L[1] 与末尾交换后下滤 O(log2 n)，</text>
    <text x="454" y="178" fill="#17343B">  总时间恒为 <tspan font-weight="700">O(n log2 n)</tspan>，空间 <tspan font-weight="700">O(1)</tspan>，不稳定（适合 Top-K）</text>

    <!-- Bottom Panel: Summary of Key Exam Properties -->
    <rect x="28" y="216" width="804" height="132" rx="6" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.5"/>
    <text x="430" y="240" fill="#17343B" font-weight="700" text-anchor="middle">3. 八大内部排序算法高频考点速断表</text>

    <text x="48" y="266" fill="#17343B">• <tspan font-weight="700" fill="#C47743">四大不稳定排序（口诀：“快希选堆”）</tspan>：<tspan font-weight="700">快速排序、希尔排序、简单选择排序、堆排序</tspan>；其余（直接插入、冒泡、归并、基数）全稳定</text>
    <text x="48" y="290" fill="#17343B">• <tspan font-weight="700" fill="#287B73">比较次数与初始序列状态无关的算法</tspan>：<tspan font-weight="700">简单选择排序 O(n²)、折半插入排序、二路归并排序（总时间无关，每趟比较微差）、基数排序</tspan></text>
    <text x="48" y="314" fill="#17343B">• <tspan font-weight="700" fill="#287B73">每趟必有元素落入最终位置</tspan>：<tspan font-weight="700">交换类（冒泡、快排）+ 选择类（简单选择、堆排）</tspan>（插入与归并在末趟前不保证）</text>
    <text x="48" y="336" fill="#61747A">• 空间复杂度：仅快速排序 O(log2 n)、二路归并排序 O(n)、基数排序 O(r)，其余五种全部为原地排序 O(1)</text>
  </g>
</svg>