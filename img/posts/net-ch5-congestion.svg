<svg xmlns="http://www.w3.org/2000/svg" width="860" height="390" viewBox="0 0 860 390" role="img" aria-label="TCP拥塞控制cwnd变化曲线：慢开始、拥塞避免、快重传、快恢复">
  <rect width="860" height="390" rx="8" fill="#F4F6F3" stroke="#D8E0DA" stroke-width="1.5"/>
  <text x="28" y="34" fill="#17343B" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700">图 5-2 · TCP 拥塞控制（慢开始 / 拥塞避免 / 快重传 / 快恢复）拥塞窗口 cwnd 变化过程</text>
  <line x1="28" y1="46" x2="832" y2="46" stroke="#CBD7CF" stroke-width="1.5"/>

  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13">
    <!-- Chart background -->
    <rect x="76" y="68" width="744" height="264" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.5"/>

    <!-- Grid lines: y = 332 - cwnd * 10 (cwnd 0..24 => y 332..92) -->
    <!-- x = 96 + round * 28 (round 0..24 => x 96..768) -->
    <g stroke="#E2EAE5" stroke-width="1">
      <line x1="76" y1="252" x2="820" y2="252"/> <!-- cwnd = 8 -->
      <line x1="76" y1="212" x2="820" y2="212"/> <!-- cwnd = 12 -->
      <line x1="76" y1="172" x2="820" y2="172"/> <!-- cwnd = 16 -->
      <line x1="76" y1="92"  x2="820" y2="92"/>  <!-- cwnd = 24 -->
    </g>

    <!-- Y axis labels -->
    <text x="66" y="338" fill="#61747A" text-anchor="end">0</text>
    <text x="66" y="321" fill="#61747A" text-anchor="end">1</text>
    <text x="66" y="256" fill="#61747A" text-anchor="end">8</text>
    <text x="66" y="216" fill="#61747A" text-anchor="end">12</text>
    <text x="66" y="176" fill="#61747A" text-anchor="end">16</text>
    <text x="66" y="96"  fill="#61747A" text-anchor="end">24</text>
    <text x="48" y="66" fill="#17343B" font-weight="700" text-anchor="middle">cwnd</text>

    <!-- ssthresh dashed lines -->
    <!-- ssthresh 1 = 16 (round 0..12, x 96..432, y 172) -->
    <line x1="96" y1="172" x2="432" y2="172" stroke="#C47743" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="275" y="190" fill="#C47743" font-weight="700">初始 ssthresh = 16</text>

    <!-- ssthresh 2 = 12 (round 12..20, x 432..656, y 212) -->
    <line x1="432" y1="212" x2="656" y2="212" stroke="#C47743" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="556" y="230" fill="#C47743" font-weight="700">ssthresh = 24/2 = 12</text>

    <!-- ssthresh 3 = 8 (round 20..24, x 656..768, y 252) -->
    <line x1="656" y1="252" x2="790" y2="252" stroke="#C47743" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="724" y="272" fill="#C47743" font-weight="700" text-anchor="middle">ssthresh = 16/2 = 8</text>

    <!-- Main cwnd polyline:
      r0(96,322)[1] -> r1(124,312)[2] -> r2(152,292)[4] -> r3(180,252)[8] -> r4(208,172)[16]
      -> r12(432,92)[24, timeout!]
      -> r12_drop(432,322)[1] -> r13(460,312)[2] -> r14(488,292)[4] -> r15(516,252)[8] -> r16(544,212)[12]
      -> r20(656,172)[16, 3 dup ACK!]
      -> r20_fr(656,252)[8] -> r24(768,212)[12] -->
    <polyline points="96,322 124,312 152,292 180,252 208,172 432,92" fill="none" stroke="#287B73" stroke-width="2.8"/>
    <line x1="432" y1="92" x2="432" y2="322" stroke="#C47743" stroke-width="2" stroke-dasharray="3 3"/>
    <polyline points="432,322 460,312 488,292 516,252 544,212 656,172" fill="none" stroke="#287B73" stroke-width="2.8"/>
    <line x1="656" y1="172" x2="656" y2="252" stroke="#C47743" stroke-width="2" stroke-dasharray="3 3"/>
    <polyline points="656,252 768,212" fill="none" stroke="#287B73" stroke-width="2.8"/>

    <!-- Key points -->
    <g fill="#287B73">
      <circle cx="96" cy="322" r="3.5"/><circle cx="124" cy="312" r="3.5"/><circle cx="152" cy="292" r="3.5"/>
      <circle cx="180" cy="252" r="3.5"/><circle cx="208" cy="172" r="4"/>
      <circle cx="432" cy="322" r="3.5"/><circle cx="544" cy="212" r="4"/>
      <circle cx="656" cy="252" r="4"/><circle cx="768" cy="212" r="3.5"/>
    </g>
    <circle cx="432" cy="92" r="4.5" fill="#C47743"/>
    <circle cx="656" cy="172" r="4.5" fill="#C47743"/>

    <!-- Stage labels -->
    <text x="132" y="236" fill="#287B73" font-weight="700" text-anchor="middle">慢开始</text>
    <text x="132" y="253" fill="#61747A" text-anchor="middle">(指数翻倍)</text>
    <text x="292" y="114" fill="#287B73" font-weight="700" text-anchor="middle">拥塞避免 (每轮 +1)</text>
    <text x="432" y="86" fill="#C47743" font-weight="700" text-anchor="middle">① 超时：cwnd 降为 1</text>
    <text x="656" y="156" fill="#C47743" font-weight="700" text-anchor="middle">② 收到 3 个重复 ACK（快重传）</text>
    <text x="742" y="202" fill="#287B73" font-weight="700" text-anchor="middle">快恢复 + 拥塞避免</text>

    <!-- X axis labels -->
    <text x="96" y="352" fill="#61747A" text-anchor="middle">0</text>
    <text x="208" y="352" fill="#61747A" text-anchor="middle">4</text>
    <text x="432" y="352" fill="#61747A" text-anchor="middle">12</text>
    <text x="544" y="352" fill="#61747A" text-anchor="middle">16</text>
    <text x="656" y="352" fill="#61747A" text-anchor="middle">20</text>
    <text x="768" y="352" fill="#61747A" text-anchor="middle">24</text>
    <text x="448" y="374" fill="#17343B" font-weight="700" text-anchor="middle">传输轮次（Transmission Round） →</text>
  </g>
</svg>