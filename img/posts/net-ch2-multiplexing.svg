<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-label="信道复用技术对比：频分复用FDM、时分复用TDM与统计时分复用STDM">
  <rect width="860" height="360" rx="8" fill="#F4F6F3" stroke="#D8E0DA" stroke-width="1.5"/>
  <text x="28" y="36" fill="#17343B" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="18" font-weight="700">图 2-2 · 物理层信道复用技术对比（FDM vs TDM vs 统计时分复用 STDM）</text>
  <line x1="28" y1="48" x2="832" y2="48" stroke="#CBD7CF" stroke-width="1.5"/>

  <!-- Box 1: FDM -->
  <rect x="28" y="64" width="252" height="272" rx="6" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.5"/>
  <text x="154" y="90" fill="#17343B" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="middle">1. 频分复用 (FDM)</text>
  <text x="154" y="110" fill="#61747A" font-family="'Microsoft YaHei',sans-serif" font-size="12" text-anchor="middle">所有用户同时传，各自独占不同频带</text>
  <!-- Axes -->
  <line x1="62" y1="280" x2="250" y2="280" stroke="#17343B" stroke-width="1.5"/>
  <line x1="62" y1="280" x2="62" y2="132" stroke="#17343B" stroke-width="1.5"/>
  <text x="50" y="142" fill="#61747A" font-family="'Microsoft YaHei',sans-serif" font-size="11" text-anchor="end">频率</text>
  <text x="246" y="298" fill="#61747A" font-family="'Microsoft YaHei',sans-serif" font-size="11" text-anchor="end">时间 →</text>
  <rect x="70" y="142" width="170" height="34" rx="3" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
  <text x="155" y="164" fill="#C47743" font-family="'Microsoft YaHei',sans-serif" font-size="12" font-weight="700" text-anchor="middle">用户 A (频带 1)</text>
  <rect x="70" y="188" width="170" height="34" rx="3" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
  <text x="155" y="210" fill="#287B73" font-family="'Microsoft YaHei',sans-serif" font-size="12" font-weight="700" text-anchor="middle">用户 B (频带 2)</text>
  <rect x="70" y="234" width="170" height="34" rx="3" fill="#E8ECE9" stroke="#61747A" stroke-width="1.5"/>
  <text x="155" y="256" fill="#17343B" font-family="'Microsoft YaHei',sans-serif" font-size="12" font-weight="700" text-anchor="middle">用户 C (频带 3)</text>
  <text x="154" y="320" fill="#61747A" font-family="'Microsoft YaHei',sans-serif" font-size="11.5" text-anchor="middle">同时间、不同频率（光纤版即 WDM）</text>

  <!-- Box 2: TDM -->
  <rect x="304" y="64" width="252" height="272" rx="6" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.5"/>
  <text x="430" y="90" fill="#17343B" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="middle">2. 同步时分复用 (TDM)</text>
  <text x="430" y="110" fill="#61747A" font-family="'Microsoft YaHei',sans-serif" font-size="12" text-anchor="middle">固定时间片轮流上，没数据也空占位置</text>
  <text x="373" y="148" fill="#61747A" font-family="'Microsoft YaHei',sans-serif" font-size="11.5" text-anchor="middle">TDM 帧 1</text>
  <text x="487" y="148" fill="#61747A" font-family="'Microsoft YaHei',sans-serif" font-size="11.5" text-anchor="middle">TDM 帧 2</text>
  <!-- Slots: A1, B(empty), C1 | A2, B(empty), C(empty) -->
  <g transform="translate(322, 162)" font-family="Consolas,monospace" font-size="12" font-weight="700" text-anchor="middle">
    <rect x="0" y="0" width="34" height="84" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
    <text x="17" y="46" fill="#C47743">A1</text>
    <rect x="34" y="0" width="34" height="84" fill="#FAFBF8" stroke="#AEBDB7" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="51" y="46" fill="#AEBDB7">空</text>
    <rect x="68" y="0" width="34" height="84" fill="#E8ECE9" stroke="#61747A" stroke-width="1.5"/>
    <text x="85" y="46" fill="#17343B">C1</text>

    <rect x="114" y="0" width="34" height="84" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
    <text x="131" y="46" fill="#C47743">A2</text>
    <rect x="148" y="0" width="34" height="84" fill="#FAFBF8" stroke="#AEBDB7" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="165" y="46" fill="#AEBDB7">空</text>
    <rect x="182" y="0" width="34" height="84" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
    <text x="199" y="46" fill="#287B73">B1</text>
  </g>
  <text x="430" y="274" fill="#C47743" font-family="'Microsoft YaHei',sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">▲ 用户没发数据时，对应时隙白白浪费</text>
  <text x="430" y="320" fill="#61747A" font-family="'Microsoft YaHei',sans-serif" font-size="11.5" text-anchor="middle">同频带、固定划分时间片</text>

  <!-- Box 3: STDM -->
  <rect x="580" y="64" width="252" height="272" rx="6" fill="#FAFBF8" stroke="#287B73" stroke-width="2"/>
  <text x="706" y="90" fill="#287B73" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="middle">3. 统计时分复用 (STDM)</text>
  <text x="706" y="110" fill="#61747A" font-family="'Microsoft YaHei',sans-serif" font-size="12" text-anchor="middle">通过集中器按需分配时隙，消除空槽</text>
  <text x="706" y="148" fill="#61747A" font-family="'Microsoft YaHei',sans-serif" font-size="11.5" text-anchor="middle">谁有数据谁上（每个时隙需附带用户地址）</text>
  <g transform="translate(618, 162)" font-family="Consolas,monospace" font-size="12" font-weight="700" text-anchor="middle">
    <rect x="0" y="0" width="44" height="84" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
    <text x="22" y="46" fill="#C47743">A1</text>
    <rect x="44" y="0" width="44" height="84" fill="#E8ECE9" stroke="#61747A" stroke-width="1.5"/>
    <text x="66" y="46" fill="#17343B">C1</text>
    <rect x="88" y="0" width="44" height="84" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
    <text x="110" y="46" fill="#C47743">A2</text>
    <rect x="132" y="0" width="44" height="84" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
    <text x="154" y="46" fill="#287B73">B1</text>
  </g>
  <text x="706" y="274" fill="#287B73" font-family="'Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">★ 紧凑无空隙，大幅提高信道利用率</text>
  <text x="706" y="320" fill="#17343B" font-family="'Microsoft YaHei',sans-serif" font-size="11.5" text-anchor="middle">因特网分组复用的物理层雏形</text>
</svg>