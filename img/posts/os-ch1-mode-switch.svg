<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-label="CPU运行模式用户态与内核态切换及中断异常分类">
  <rect width="860" height="360" rx="8" fill="#F4F6F3" stroke="#D8E0DA" stroke-width="1.5"/>
  <text x="28" y="34" fill="#17343B" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700">图 1-1 · CPU 双模式运行机制（用户态 vs 内核态）与中断 / 异常分类体系</text>
  <line x1="28" y1="46" x2="832" y2="46" stroke="#CBD7CF" stroke-width="1.5"/>

  <defs>
    <marker id="aT" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#287B73"/>
    </marker>
    <marker id="aO" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#C47743"/>
    </marker>
  </defs>

  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13">
    <!-- Left Panel: Mode Switch Flow -->
    <rect x="28" y="64" width="400" height="272" rx="6" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="228" y="90" fill="#287B73" font-weight="700" text-anchor="middle">1. 用户态（Ring 3）与内核态（Ring 0）切换闭环</text>

    <!-- User Mode Box -->
    <rect x="48" y="108" width="360" height="72" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.5"/>
    <text x="64" y="132" fill="#287B73" font-weight="700">用户态（目态 · PSW = 1）</text>
    <text x="64" y="154" fill="#17343B">• 仅能执行非特权指令，仅能访问用户空间虚拟地址</text>
    <text x="64" y="172" fill="#61747A">• 若强行执行特权指令（I/O、改页表）将触发硬件异常</text>

    <!-- Arrows between User Mode and Kernel Mode -->
    <line x1="168" y1="180" x2="168" y2="224" stroke="#C47743" stroke-width="2" marker-end="url(#aO)"/>
    <text x="158" y="206" fill="#C47743" font-weight="700" text-anchor="end">中断/异常/trap</text>
    <text x="176" y="206" fill="#C47743" font-weight="700">(硬件置 PSW=0)</text>

    <line x1="330" y1="228" x2="330" y2="184" stroke="#287B73" stroke-width="2" marker-end="url(#aT)"/>
    <text x="340" y="206" fill="#287B73" font-weight="700">iret 中断返回</text>

    <!-- Kernel Mode Box -->
    <rect x="48" y="230" width="360" height="88" rx="4" fill="#F4E6D9" stroke="#C47743" stroke-width="1.5"/>
    <text x="64" y="254" fill="#C47743" font-weight="700">内核态（管态 / 核心态 · PSW = 0）</text>
    <text x="64" y="276" fill="#17343B">• 可执行全部指令（含特权指令：I/O、置时钟、改 CR3）</text>
    <text x="64" y="298" fill="#17343B" font-weight="700">• 铁律：由用户态进入内核态的唯一途径是中断 / 异常</text>

    <!-- Right Panel: Interrupt & Exception Taxonomy -->
    <rect x="448" y="64" width="384" height="272" rx="6" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.5"/>
    <text x="640" y="90" fill="#17343B" font-weight="700" text-anchor="middle">2. 外中断（异步）与内中断 / 异常（同步）分类</text>

    <!-- External Interrupts -->
    <rect x="458" y="108" width="364" height="68" rx="4" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <text x="470" y="130" fill="#287B73" font-weight="700">① 外中断（Interrupt · 与当前指令无关的异步信号）：</text>
    <text x="470" y="152" fill="#17343B">• <tspan font-weight="700">可屏蔽中断</tspan>（INTR 引脚，受 IF 控制，如时钟/网卡 I/O）</text>
    <text x="470" y="168" fill="#17343B">• <tspan font-weight="700">不可屏蔽中断</tspan>（NMI 引脚，紧急硬件故障如掉电、奇偶错）</text>

    <!-- Internal Exceptions -->
    <rect x="458" y="186" width="364" height="132" rx="4" fill="#E8ECE9" stroke="#AEBDB7" stroke-width="1.2"/>
    <text x="470" y="208" fill="#C47743" font-weight="700">② 内中断 / 异常（Exception · 当前指令引发的同步事件）：</text>
    <text x="470" y="232" fill="#17343B">• <tspan font-weight="700" fill="#287B73">自陷 (Trap)</tspan>：主动触发（如系统调用 <tspan font-weight="700">syscall</tspan>、断点调试），</text>
    <text x="470" y="250" fill="#61747A">  处理完毕后返回到<tspan font-weight="700" fill="#17343B">下一条指令</tspan>继续执行</text>
    <text x="470" y="274" fill="#17343B">• <tspan font-weight="700" fill="#C47743">故障 (Fault)</tspan>：可修复异常（如<tspan font-weight="700">缺页异常 Page Fault</tspan>），</text>
    <text x="470" y="292" fill="#61747A">  调入物理页修复后，返回到<tspan font-weight="700" fill="#C47743">当前引起故障的指令</tspan>重新执行</text>
    <text x="470" y="312" fill="#17343B">• <tspan font-weight="700">终止 (Abort)</tspan>：致命不可恢复错误，直接终止当前进程</text>
  </g>
</svg>