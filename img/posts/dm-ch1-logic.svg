<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-label="五种基本联结词真值表与极小项极大项构造规则">
  <rect width="860" height="360" rx="8" fill="#F4F6F3" stroke="#D8E0DA" stroke-width="1.5"/>
  <text x="28" y="34" fill="#17343B" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700">图 1-1 · 基本逻辑联结词真值表与极小项 (mi) / 极大项 (Mi) 编码规则</text>
  <line x1="28" y1="46" x2="832" y2="46" stroke="#CBD7CF" stroke-width="1.5"/>

  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13">
    <!-- Left Box: Truth Table -->
    <rect x="28" y="62" width="384" height="274" rx="6" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1.5"/>
    <text x="220" y="88" fill="#17343B" font-weight="700" text-anchor="middle">1. 五种基本联结词真值表</text>

    <!-- Table Header -->
    <rect x="46" y="102" width="348" height="34" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <g fill="#17343B" font-weight="700" text-anchor="middle">
      <text x="68"  y="124">P</text>
      <text x="110" y="124">Q</text>
      <text x="156" y="124">¬P</text>
      <text x="206" y="124">P ∧ Q</text>
      <text x="258" y="124">P ∨ Q</text>
      <text x="312" y="124">P → Q</text>
      <text x="366" y="124">P ↔ Q</text>
    </g>

    <!-- Row 1: 0 0 -->
    <rect x="46" y="136" width="348" height="34" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1"/>
    <g fill="#17343B" text-anchor="middle">
      <text x="68"  y="158">0</text><text x="110" y="158">0</text><text x="156" y="158">1</text>
      <text x="206" y="158">0</text><text x="258" y="158">0</text><text x="312" y="158" fill="#287B73" font-weight="700">1</text><text x="366" y="158">1</text>
    </g>

    <!-- Row 2: 0 1 -->
    <rect x="46" y="170" width="348" height="34" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1"/>
    <g fill="#17343B" text-anchor="middle">
      <text x="68"  y="192">0</text><text x="110" y="192">1</text><text x="156" y="192">1</text>
      <text x="206" y="192">0</text><text x="258" y="192">1</text><text x="312" y="192" fill="#287B73" font-weight="700">1</text><text x="366" y="192">0</text>
    </g>

    <!-- Row 3: 1 0 (Highlight P->Q = 0) -->
    <rect x="46" y="204" width="348" height="34" fill="#F4E6D9" stroke="#C47743" stroke-width="1.2"/>
    <g fill="#17343B" text-anchor="middle">
      <text x="68"  y="226" font-weight="700">1</text><text x="110" y="226" font-weight="700">0</text><text x="156" y="226">0</text>
      <text x="206" y="226">0</text><text x="258" y="226">1</text><text x="312" y="226" fill="#C47743" font-weight="700">0</text><text x="366" y="226">0</text>
    </g>

    <!-- Row 4: 1 1 -->
    <rect x="46" y="238" width="348" height="34" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1"/>
    <g fill="#17343B" text-anchor="middle">
      <text x="68"  y="260">1</text><text x="110" y="260">1</text><text x="156" y="260">0</text>
      <text x="206" y="260" fill="#287B73" font-weight="700">1</text><text x="258" y="260">1</text><text x="312" y="260" fill="#287B73" font-weight="700">1</text><text x="366" y="260" fill="#287B73" font-weight="700">1</text>
    </g>

    <text x="220" y="300" fill="#C47743" font-weight="700" text-anchor="middle">蕴涵 P → Q：仅当“前件 P=1 且后件 Q=0”时为 0</text>
    <text x="220" y="320" fill="#61747A" text-anchor="middle">等价式：P → Q ⇔ ¬P ∨ Q</text>

    <!-- Right Box: Minterms & Maxterms -->
    <rect x="432" y="62" width="400" height="274" rx="6" fill="#FAFBF8" stroke="#287B73" stroke-width="1.5"/>
    <text x="632" y="88" fill="#17343B" font-weight="700" text-anchor="middle">2. 极小项 (mi) 与极大项 (Mi) 对应表</text>

    <rect x="450" y="102" width="364" height="34" fill="#D8E6E0" stroke="#287B73" stroke-width="1.2"/>
    <g fill="#17343B" font-weight="700" text-anchor="middle">
      <text x="484" y="124">赋值 PQ</text>
      <text x="548" y="124">下标 i</text>
      <text x="638" y="124">极小项 mi (真=1)</text>
      <text x="754" y="124">极大项 Mi (假=0)</text>
    </g>

    <g fill="#17343B" text-anchor="middle">
      <rect x="450" y="136" width="364" height="34" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1"/>
      <text x="484" y="158">0 0</text><text x="548" y="158">0</text>
      <text x="638" y="158" fill="#287B73" font-weight="700">m0 = ¬P ∧ ¬Q</text>
      <text x="754" y="158" fill="#C47743" font-weight="700">M0 = P ∨ Q</text>

      <rect x="450" y="170" width="364" height="34" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1"/>
      <text x="484" y="192">0 1</text><text x="548" y="192">1</text>
      <text x="638" y="192" fill="#287B73" font-weight="700">m1 = ¬P ∧ Q</text>
      <text x="754" y="192" fill="#C47743" font-weight="700">M1 = P ∨ ¬Q</text>

      <rect x="450" y="204" width="364" height="34" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1"/>
      <text x="484" y="226">1 0</text><text x="548" y="226">2</text>
      <text x="638" y="226" fill="#287B73" font-weight="700">m2 = P ∧ ¬Q</text>
      <text x="754" y="226" fill="#C47743" font-weight="700">M2 = ¬P ∨ Q</text>

      <rect x="450" y="238" width="364" height="34" fill="#FAFBF8" stroke="#CBD7CF" stroke-width="1"/>
      <text x="484" y="260">1 1</text><text x="548" y="260">3</text>
      <text x="638" y="260" fill="#287B73" font-weight="700">m3 = P ∧ Q</text>
      <text x="754" y="260" fill="#C47743" font-weight="700">M3 = ¬P ∨ ¬Q</text>
    </g>

    <text x="632" y="300" fill="#287B73" font-weight="700" text-anchor="middle">极小项：1 对应原变元，0 对应否定变元（合取 ∧）</text>
    <text x="632" y="320" fill="#C47743" font-weight="700" text-anchor="middle">极大项：0 对应原变元，1 对应否定变元（析取 ∨）</text>
  </g>
</svg>