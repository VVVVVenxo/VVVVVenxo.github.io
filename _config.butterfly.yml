# Butterfly 主题配置 - https://butterfly.js.org/

favicon: /img/cat.ico

nav:
  logo:
  display_title: true
  fixed: true

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  关于: /about/ || fas fa-heart

code_blocks:
  theme: light
  macStyle: false
  height_limit: 300
  word_wrap: false
  copy: true
  language: true
  shrink: false

social:
  fab fa-github: https://github.com/VVVVVenxo || Github
  fas fa-envelope: mailto:1263147353@qq.com || Email
  fab fa-steam: https://steamcommunity.com/profiles/76561198863443106/ || Steam

# 首页大图
index_img: /img/banner.jpg

# 文章默认封面
default_top_img: false

avatar:
  img: /img/Avatar.jpg
  effect: false

index_card_style: card
index_layout: 4
index_post_content:
  method: 1
  length: 180

cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  position: both
  default_cover:
    - /img/covers/Roaming.jpg

post_meta:
  page:
    date_type: created
    date_format: YYYY-MM-DD
    categories: true
    tags: false
    label: false
  post:
    date_type: both
    date_format: relative
    categories: true
    tags: true
    label: true

post_copyright:
  enable: true
  decode: true
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

toc:
  post: true
  page: false
  number: false
  expand: false
  style_simple: false
  scroll_percent: true

aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: To be a rock and not to roll.
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/VVVVVenxo
  card_announcement:
    enable: true
    content: |
      <div class="profile-note">
        <p>软件工程背景，专注游戏客户端开发。</p>
        <p><strong>关注</strong> Unity 架构、网络同步与实时渲染。</p>
        <p class="profile-note__meta">游戏开发 · AI 工具 · 图形技术</p>
      </div>
  card_recent_post:
    enable: true
    limit: 3
    sort: date
    sort_order:
  card_categories:
    enable: true
    limit: 5
    expand: none
    sort_order:
  card_tags:
    enable: true
    limit: 12
    color: false
    orderby: name
    order: 1
    sort_order:
  card_archives:
    enable: false
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 5
    sort_order:
  card_webinfo:
    enable: false
    post_count: true
    last_push_date: true
    sort_order:

footer:
  owner:
    enable: true
    since: 2024
  custom_text: Everything's Alright
  copyright: true

rightside_bottom:

go_up:
  enable: true

darkmode:
  enable: true
  button: true
  autoChangeMode: false

readmode: true

copy:
  enable: true
  copyright:
    enable: false
    limit_count: 50

search:
  use: local_search
  placeholder: 搜索文章、Unity、C++、C#…
  local_search:
    preload: false
    top_n_per_article: 2
    unescape: false
    pagination:
      enable: false
      hitsPerPage: 8
    CDN:

math:
  enable: false
  per_page: true

lazyload:
  enable: false
  field: post
  placeholder:
  blur: false

fancybox: true

preloader:
  enable: true
  source: 2
  pace_css_url: /css/pace-theme-editorial.css

wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# 打字机效果
subtitle:
  enable: true
  effect: true
  loop: true
  source: false
  sub:
    - "System.out.println(\"Hello World\");"
    - "To be a rock and not to roll."
    - "Game Developer | Tech Explorer"
    - "Keep Learning, Keep Growing."

anchor:
  auto_update: false
  click:
    enable: false
    always_show: false

photofigcaption: false

Open_Graph_meta:
  enable: true
  option:

beautify:
  enable: true
  field: site
  title_prefix_icon: '\f0c1'
  title_prefix_icon_color: '#2F766A'

font:
  global-font-size: 17px
  code-font-size: 15px
  font-family: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif'
  code-font-family: '"Cascadia Code", "Fira Code", Consolas, Monaco, monospace'

background: "#F1F4F1"

footer_bg: true

theme_color:
  enable: true
  main: '#2F766A'
  paginator: '#2F766A'
  button_hover: '#245D55'
  text_selection: '#C9DDD5'
  link_color: '#2F766A'
  meta_color: '#77847F'
  hr_color: '#DCE3DD'
  code_foreground: '#2F6659'
  code_background: '#EAF0EB'
  toc_color: '#2F766A'
  blockquote_padding_color: '#2F766A'
  blockquote_background_color: '#EAF0EB'
  scrollbar_color: '#2F766A'

category_ui: index
tag_ui: index

pjax:
  enable: true

inject:
  head:
    - <meta name="referrer" content="no-referrer">
    - <link rel="stylesheet" href="/css/site-refinement.css?v=20261016-2">
  bottom:
    - <script src="/js/site-refinement.js?v=20261016-2" defer></script>

CDN:
  third_party_provider: jsdelivr
  option:
