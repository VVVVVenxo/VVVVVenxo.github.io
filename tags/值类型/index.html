      (function () {
        // Theme Toggle
        const themeToggle = document.getElementById('theme-toggle');
        if (themeToggle) {
          themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            const giscusFrame = document.querySelector('iframe.giscus-frame');
            if (giscusFrame && giscusFrame.contentWindow) {
              giscusFrame.contentWindow.postMessage(
                { giscus: { setConfig: { theme: isDark ? 'dark_dimmed' : 'light' } } },
                'https://giscus.app'
              );
            }
          });
        }

        // Mobile Menu Toggle
        const mobileBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        if (mobileBtn && mobileMenu) {
          mobileBtn.addEventListener('click', () => {
            const hidden = mobileMenu.classList.toggle('hidden');
            mobileBtn.setAttribute('aria-expanded', String(!hidden));
          });
        }

        // Code Copy Buttons
        document.addEventListener('click', async e => {
          const btn = e.target.closest('.copy-button');
          if (!btn) return;
          const wrapper = btn.closest('.code-block-wrapper');
          const codeEl = wrapper ? wrapper.querySelector('pre code') : null;
          if (!codeEl) return;
          try {
            await navigator.clipboard.writeText(codeEl.innerText);
            const copyIcon = btn.querySelector('.copy-icon');
            const checkIcon = btn.querySelector('.check-icon');
            btn.classList.add('copied');
            if (copyIcon) copyIcon.classList.add('hidden');
            if (checkIcon) checkIcon.classList.remove('hidden');
            setTimeout(() => {
              btn.classList.remove('copied');
              if (copyIcon) copyIcon.classList.remove('hidden');
              if (checkIcon) checkIcon.classList.add('hidden');
            }, 1800);
          } catch (_) {}
        });

        // Search Modal
        const searchBtn = document.getElementById('search-btn');
        const searchModal = document.getElementById('search-modal');
        const searchInput = document.getElementById('search-input');
        const searchClose = document.getElementById('search-close');
        const searchResults = document.getElementById('search-results');
        let searchIndex = null;

        async function ensureSearchIndex() {
          if (searchIndex) return searchIndex;
          try {
            const res = await fetch('/search.json');
            searchIndex = await res.json();
          } catch (_) {
            searchIndex = [];
          }
          return searchIndex;
        }

        function openSearch() {
          if (!searchModal) return;
          searchModal.classList.remove('hidden');
          searchModal.classList.add('flex');
          document.body.style.overflow = 'hidden';
          ensureSearchIndex();
          setTimeout(() => searchInput && searchInput.focus(), 30);
        }

        function closeSearch() {
          if (!searchModal) return;
          searchModal.classList.add('hidden');
          searchModal.classList.remove('flex');
          document.body.style.overflow = '';
        }

        if (searchBtn) searchBtn.addEventListener('click', openSearch);
        if (searchClose) searchClose.addEventListener('click', closeSearch);
        if (searchModal) {
          searchModal.addEventListener('click', e => {
            if (e.target === searchModal) closeSearch();
          });
        }

        window.addEventListener('keydown', e => {
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            if (searchModal && searchModal.classList.contains('hidden')) openSearch();
            else closeSearch();
          } else if (e.key === 'Escape' && searchModal && !searchModal.classList.contains('hidden')) {
            closeSearch();
          }
        });

        function escapeHtml(s) {
          return String(s || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
        }

        if (searchInput && searchResults) {
          searchInput.addEventListener('input', async () => {
            const q = searchInput.value.trim().toLowerCase();
            if (!q) {
              searchResults.innerHTML = '<p class="py-6 text-center text-[var(--text-tertiary)]">输入关键词开始检索全部文章…</p>';
              return;
            }
            const data = await ensureSearchIndex();
            const matched = data.filter(item => {
              const title = (item.title || '').toLowerCase();
              const content = (item.content || '').toLowerCase();
              const tags = (item.tags || []).join(' ').toLowerCase();
              const cats = (item.categories || []).join(' ').toLowerCase();
              return title.includes(q) || tags.includes(q) || cats.includes(q) || content.includes(q);
            });

            if (!matched.length) {
              searchResults.innerHTML = '<p class="py-6 text-center text-[var(--text-tertiary)]">没有找到匹配的文章</p>';
              return;
            }

            searchResults.innerHTML = matched
              .slice(0, 15)
              .map(item => {
                const rawText = item.content || '';
                const idx = rawText.toLowerCase().indexOf(q);
                let snippet = rawText.slice(0, 110);
                if (idx > 30) {
                  snippet = '…' + rawText.slice(idx - 25, idx + 85) + '…';
                }
                return `
                  <a href="${item.url}" class="block py-3.5 transition-colors hover:text-[var(--accent)]">
                    <div class="flex items-baseline justify-between gap-2">
                      <span class="font-semibold text-[var(--text-primary)]">${escapeHtml(item.title)}</span>
                      <span class="shrink-0 text-xs text-[var(--text-tertiary)]">${escapeHtml(item.date || '')}</span>
                    </div>
                    <p class="mt-1 line-clamp-2 text-xs leading-relaxed text-[var(--text-secondary)]">${escapeHtml(snippet)}</p>
                  </a>
                `;
              })
              .join('');
          });
        }
      })();
    </script> </body> </html>
